openapi: 3.0.3
# 3.0.x, not 3.1: oapi-codegen only supports 3.0.

info:
  title: Bucky BudgetR API
  version: 0.1.0
  description: |
    REST API of Bucky BudgetR, a self-hosted envelope-style budgeting app.

    This file is the contract. The Go server code and the TypeScript client
    are generated from it (`make generate`), so change the API here first.

    Conventions:
    - Resources live under `/api/v1`. The health probes `/healthz` and
      `/readyz` are at the root.
    - IDs are JSON **strings** of digits. Some are too large for a JavaScript
      number.
    - Amounts are decimal **strings** such as `"1234.50"`, never floats.
    - Every error response is an RFC 9457 problem (`application/problem+json`,
      schema `Problem`).
    - Timestamps are RFC 3339 in UTC (`2026-10-25T14:03:00Z`). Clients show
      them in local time.

    Authentication: log in with `POST /api/v1/auth/login`. The session is an
    HttpOnly cookie (`__Host-bucky_session`) that the browser sends by itself.
    **Every POST, PUT, PATCH and DELETE must also carry the header
    `X-Bucky-CSRF: 1`** (CSRF protection), or it is rejected with 403.

    A user whose `must_change_password` is set may only call operations
    marked `x-allowed-before-password-change`; everything else gets 403
    `password_change_required`. Operations marked `x-admin-only` need an
    admin; others get 403 `admin_only`.

servers:
  - url: /

# Everything requires a session unless an operation says otherwise.
security:
  - cookieAuth: []

tags:
  - name: system
    description: Health and readiness probes.
  - name: auth
    description: Login, logout and the current user.
  - name: accounts
    description: Bank accounts and their balances.
  - name: cycles
    description: Budget cycles and their lifecycle.
  - name: buckets
    description: Buckets, their settings and their funds.
  - name: transactions
    description: Income, expenses and transfers, and the transaction list.
  - name: admin
    description: User management, for admins only.
  - name: stats
    description: Aggregated series for graphs and reports (#119).

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness probe
      description: Reports that the process is up. Checks nothing else.
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Error"

  /readyz:
    get:
      operationId: getReadyz
      tags: [system]
      summary: Readiness probe
      description: Reports whether the server can handle requests, that is, whether the database is reachable.
      security: []
      responses:
        "200":
          description: The server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: The database is not reachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      description: |
        Checks the credentials and starts a session (sets the session cookie).
        Wrong username, wrong password and inactive users all get the same 401.
        Repeated failures are rate limited with 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. If `must_change_password` is set, only changing the password is allowed until it is done.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          description: Too many failed attempts. Try again after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/password-link:
    post:
      operationId: checkPasswordLink
      tags: [auth]
      summary: Check a setup or reset link
      description: |
        Tells whether a link from an admin works, and for whom. An unknown,
        used or expired link, or one for an inactive user, is 404
        `invalid_link`. The token is sent in the body rather than the URL, so
        it stays out of logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLinkCheck"
      responses:
        "200":
          description: The link works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordLinkInfo"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/password-link/use:
    post:
      operationId: usePasswordLink
      tags: [auth]
      summary: Set a password with a link and log in
      description: |
        Sets the user's password with a setup or reset link, uses the link
        up, ends the user's other sessions and starts a session (sets the
        session cookie). A weak password is 400 `weak_password` and leaves
        the link working; a link that doesn't work is 404 `invalid_link`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLinkUse"
      responses:
        "200":
          description: Password set and logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      operationId: logout
      x-allowed-before-password-change: true
      tags: [auth]
      summary: Log out
      description: Ends the current session and clears the cookie.
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      operationId: getMe
      x-allowed-before-password-change: true
      tags: [auth]
      summary: The current user
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/password:
    post:
      operationId: changePassword
      x-allowed-before-password-change: true
      tags: [auth]
      summary: Change the password
      description: |
        Changes the current user's password, clears `must_change_password` and
        ends all of the user's other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/preferences:
    patch:
      operationId: updatePreferences
      tags: [auth]
      summary: Update preferences
      description: Merges the given fields into the stored preferences. `null` resets a field to its default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: The preferences after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      x-admin-only: true
      tags: [admin]
      summary: List users
      description: Every user, sorted by username, with when they last used the app.
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      x-admin-only: true
      tags: [admin]
      summary: Create a user
      description: |
        Creates an active user who gets in with `credential`: a generated
        temporary password, which they must change at first login, or a setup
        link where they choose their own password. Either is returned only
        here. A taken username (ignoring case) is 409 `username_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: The user, and their temporary password or setup link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      x-admin-only: true
      tags: [admin]
      summary: Activate, deactivate, grant or revoke admin
      description: |
        Deactivating ends the user's sessions and blocks login; their data is
        kept. The last active admin can't be deactivated or demoted (409
        `last_admin`), and admins can't change themselves here (409
        `own_account`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{userId}/reset-password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: resetUserPassword
      x-admin-only: true
      tags: [admin]
      summary: Reset a user's password
      description: |
        Replaces the user's password at once and ends their sessions. They
        get back in with `credential` (by default a temporary password):
        a generated temporary password, which they must change at their next
        login, or a reset link where they choose a new one. Either is
        returned only here, and voids an earlier link. Admins change their
        own password with `POST /me/password` (409 `own_account`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "200":
          description: The temporary password or reset link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewCredential"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/reports/flows:
    get:
      operationId: listAccountFlows
      tags: [accounts]
      summary: Money in and out of each account over a period
      description: |
        For the Dashboard's In/out widget (#90): each account's income
        (INC), expenses (EXP) and transfers in and out (TRF) over [`from`,
        `to`). Expenses and transfers out are positive amounts, in the
        account's currency. A transaction counts on its original's date with
        its corrections, as the transaction list shows it, so a reversed one
        adds up to 0. Balance adjustments, opening balances and bucket-only
        lines don't count.

        Only accounts with such transactions are listed, sorted by ID.
        `from` must be before `to` (400 `invalid_request`).
      parameters:
        - name: from
          in: query
          required: true
          description: The start of the period (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: The end of the period (exclusive).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The flows, one per account with any.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountFlow"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/stats/series:
    get:
      operationId: getStatsSeries
      tags: [stats]
      summary: Spending, income or balances over a period, per interval
      description: |
        For graphs, reports and widgets (#121): `from`…`to` cut into
        intervals of `resolution`, with one sum per interval in each series.

        - **Intervals** are cut in local time (`time_zone`, else the user's
          preference, else UTC), with weeks starting on `week_start`. The
          first and last are cut at `from` and `to`. `cycle` gives one
          interval per cycle that overlaps the period (days outside any
          cycle aren't covered), `total` one for the whole period. At most
          1000 intervals (400 `too_many_intervals`).
        - **Spending** is expenses (EXP) as a positive amount, **income**
          is income (INC), net of corrections: a transaction counts on its
          original's date with its corrections, as the transaction list
          shows it, so a reversed one adds up to 0. With `transfers`,
          transfers (TRF) count too: money in as income, money out as
          spending (for a one-account graph, as #90 does).
        - **Balance** is each account's balance at the end of each interval:
          every line dated before it, of any type.
        - **Grouping:** `none` gives one series per currency, `account` one
          per account, `bucket` one per bucket plus one without a bucket
          (`bucket_id` null) for the part of expenses or income on no
          bucket. Spending and income by bucket, or with `bucket_id`, use
          the bucket lines; otherwise the bank lines. `balance` can't be
          grouped by bucket.
        - **Currencies** are never added up: each series has one currency.
        - **Filters** work as on the transaction list. Several values of a
          filter match any of them.

        Empty intervals are 0. `from` must be before `to` (400
        `invalid_request`).
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [spending, income, balance]
        - name: from
          in: query
          required: true
          description: The start of the period (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: The end of the period (exclusive).
          schema:
            type: string
            format: date-time
        - name: resolution
          in: query
          required: true
          schema:
            type: string
            enum: [hour, day, week, month, year, cycle, total]
        - name: time_zone
          in: query
          description: The IANA time zone the intervals are cut in. Defaults to the user's `time_zone` preference, else UTC.
          schema:
            type: string
            maxLength: 64
            example: Europe/Oslo
        - name: week_start
          in: query
          description: The first day of the week, 1 (Monday) to 7 (Sunday). Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 7
        - name: group_by
          in: query
          description: One series per currency (`none`, the default), per account, or per bucket.
          schema:
            type: string
            enum: [none, account, bucket]
        - name: account_id
          in: query
          description: Only these accounts' lines (or their buckets' lines). Repeat for several.
          schema:
            type: array
            maxItems: 50
            items:
              $ref: "#/components/schemas/AccountId"
          style: form
          explode: true
        - name: bucket_id
          in: query
          description: Only these buckets' lines. Repeat for several. Not for `balance`.
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/BucketId"
          style: form
          explode: true
        - name: tag
          in: query
          description: Only transactions with any of these tags, ignoring case. Repeat for several. Not for `balance`.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 50
          style: form
          explode: true
        - name: counterparty
          in: query
          description: Only transactions whose counterparty contains this text, ignoring case. Not for `balance`.
          schema:
            type: string
            maxLength: 200
        - name: transfers
          in: query
          description: Count transfers as income (in) and spending (out). Not for `balance`.
          schema:
            type: boolean
      responses:
        "200":
          description: The intervals and the series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSeries"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List accounts
      description: The user's accounts that aren't deleted, sorted by name, each with its current balance.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      description: |
        Creates an account. A non-zero `opening_balance` is recorded as an
        Opening Balance (OPB) transaction at `opening_at` (default now).
        Names must be unique among the user's accounts (409 `name_taken`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get an account
      responses:
        "200":
          description: The account with its current balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Rename an account or change its type
      description: The currency can't be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{accountId}/balance-adjustment:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: adjustAccountBalance
      tags: [accounts]
      summary: Adjust the balance
      description: |
        Sets the balance as of `at` (default now) to `target_balance` by
        recording a Balance Adjustment (BLA) for the difference. Transactions
        at or before `at` count. 400 `no_change` if there is no difference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustment"
      responses:
        "200":
          description: The account with its current balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{accountId}/reallocate:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: reallocateAccount
      tags: [accounts]
      summary: Reallocate the account's money
      description: |
        Runs the Money Allocation Routine for the buckets funded from the
        account now (spec §7), splitting its money by TF, priority and
        importance. CAF otherwise only moves on the routine's triggers, so this
        reshares an underfunded account by hand, for example after a refill.
      responses:
        "200":
          description: The account, with what's unallocated now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{accountId}/delete:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      description: |
        Deletes the account after settling it, all at once:
        - every bucket funded from it moves to the account given in
          `bucket_sources`, otherwise 409 `account_has_buckets`;
        - money left in it is transferred (TRF) or adjusted away (BLA) as
          `remaining_funds` says, otherwise 409 `balance_not_zero`.

        If either is refused, nothing changes. Money and buckets can only move
        to another account in the same currency (400 `currency_mismatch`).
        The account's transactions are kept.

        This is a POST rather than DELETE because it carries a body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDelete"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles:
    get:
      operationId: listCycles
      tags: [cycles]
      summary: List cycles
      description: All of the user's cycles, oldest first.
      responses:
        "200":
          description: The cycles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cycle"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCycle
      tags: [cycles]
      summary: Plan a cycle
      description: |
        Creates a future cycle from `start_at` up to, but not including,
        `end_at`. The UI sends the UTC moments of local midnight. The cycle
        must end in the future and can't overlap another of the user's
        cycles (409 `cycle_overlap`); it may start exactly where another ends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleTimes"
      responses:
        "201":
          description: The planned cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycle-rule/periods:
    post:
      operationId: cycleRulePeriods
      tags: [cycles]
      summary: Preview a cycle rule
      description: |
        The periods a cycle rule gives, as local dates, from the one
        containing `from`. Changes nothing; the rule needn't be saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CyclePeriodsRequest"
      responses:
        "200":
          description: The periods.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CyclePeriod"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/active:
    get:
      operationId: getCurrentCycles
      tags: [cycles]
      summary: The active and next cycle
      description: |
        The active cycle and the next planned one; either can be null. With no
        active cycle, the UI prompts the user to start `next` or plan a cycle.
      responses:
        "200":
          description: The current cycles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCycles"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/{cycleId}:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: getCycle
      tags: [cycles]
      summary: Get a cycle
      responses:
        "200":
          description: The cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCycle
      tags: [cycles]
      summary: Move or extend a cycle
      description: |
        A future cycle can change its start and end. The active cycle can only
        change its end, to a moment in the future and after its last bucket
        transaction: this is how an overdue cycle is extended. If the next
        planned cycle starts before the new end, its start moves to the new
        end (409 `cycle_overlap` if it would have no time left). Finished
        cycles can't change (409 `cycle_finished`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleUpdate"
      responses:
        "200":
          description: The updated cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCycle
      tags: [cycles]
      summary: Delete a planned cycle
      description: Only future cycles can be deleted (409 `cycle_not_future`).
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/{cycleId}/start:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    post:
      operationId: startCycle
      tags: [cycles]
      summary: Start a planned cycle
      description: |
        Starts the next planned cycle when the user has no active cycle (409
        `active_cycle_exists`). Only the earliest future cycle can be started
        (409 `not_next_cycle`). Started before its planned start, it starts
        now; otherwise it keeps its planned start. Runs the cycle-start
        routine.
      responses:
        "200":
          description: The started cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/{cycleId}/end:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    post:
      operationId: endCycle
      tags: [cycles]
      summary: End the active cycle
      description: |
        Runs the cycle-end routine and finishes the active cycle (409
        `cycle_not_active` otherwise).

        - **On time or late:** the cycle keeps its planned end. Cycles end on
          their intended dates.
        - **Early:** the cycle ends now (or just after its last bucket
          transaction, if that is later).

        The next planned cycle then starts if it begins where this one ended.
        If it begins later, it starts right away (its start moves to where
        this one ended) only with `start_next`; otherwise there is a gap with
        no active cycle, in which transactions can't have bucket lines.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleEnd"
      responses:
        "200":
          description: The ended cycle and the one that started, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleEndResult"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/{cycleId}/bucket-figures:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: listBucketFigures
      tags: [buckets]
      summary: The buckets' figures for a cycle
      description: |
        What happened to each bucket in the cycle (spec §4), for the Buckets
        screen's "used X of Y": its TF when the cycle began, what was put in
        or taken out by type, what was spent and what overflowed. Calculated
        from the bucket lines; lines from later cycles don't count, so a
        finished cycle's figures stay as they were.

        Every bucket that isn't deleted is listed, sorted by ID, with zeros
        when nothing happened to it. A cycle that isn't the user's gets 404.
      responses:
        "200":
          description: The figures, one per bucket.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BucketFigures"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets:
    get:
      operationId: listBuckets
      tags: [buckets]
      summary: List buckets
      description: The user's buckets that aren't deleted, sorted by name, each with its TF and CAF.
      responses:
        "200":
          description: The buckets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bucket"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBucket
      tags: [buckets]
      summary: Create a bucket
      description: |
        Creates a bucket funded from `source_account_id`, in that account's
        currency. Names must be unique among the user's buckets (409
        `name_taken`).

        A non-zero `opening_funds` is recorded now as an Opening Funds (OPF)
        transaction. Like every bucket transaction, that needs an active
        cycle: without one the answer is 409 `no_active_cycle`, and with an
        overdue one 409 `cycle_overdue`. Nothing is created then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketCreate"
      responses:
        "201":
          description: The new bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/refill-amounts:
    post:
      operationId: setRefillAmounts
      tags: [buckets]
      summary: Set several buckets' refill amounts at once
      description: |
        Budget setup's save (spec §9): sets each bucket's refill amount, all
        or nothing. By default it is the *Future* adjustment: TF is unchanged
        and no transaction is recorded. As with `PATCH /buckets/{bucketId}`, a
        fixed capacity below the new refill amount is raised to it.

        With `this_cycle` (#81) it is also *Both* for each bucket refilled in
        the active cycle: a BUA of the change in RA, so TF moves by the same
        amount (it may go below 0). A bucket not refilled yet this cycle only
        gets the new RA, which its refill then uses. Needs an active cycle
        (409 `no_active_cycle`) that hasn't run past its end (409).

        A bucket may appear once (400 `invalid_request`); an unknown or
        deleted bucket is 404. A `fully_manual` bucket has no refill amount
        (400 `invalid_request`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefillAmounts"
      responses:
        "200":
          description: The updated buckets, in the order given.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/{bucketId}:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    get:
      operationId: getBucket
      tags: [buckets]
      summary: Get a bucket
      responses:
        "200":
          description: The bucket with its TF and CAF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateBucket
      tags: [buckets]
      summary: Change a bucket's settings
      description: |
        The source account can only change to an account in the same currency
        (400 `currency_mismatch`). Changing it resets CAF to 0 until the
        allocation routine funds the bucket from the new account.

        Switching `cap_mode` without the new mode's value uses multiplier 1,
        or a fixed amount equal to the refill amount. A fixed capacity below
        the refill amount is raised to it.

        Switching to `fully_manual` (#76) sets the refill amount to 0, turns
        `keep_funds` on and makes a multiplier capacity `none`; TF stays.
        Asking for a refill amount above 0, `keep_funds: false` or the
        multiplier capacity in the same request is 400. Switching away from
        it with no capacity uses multiplier 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketUpdate"
      responses:
        "200":
          description: The updated bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBucket
      tags: [buckets]
      summary: Delete a bucket
      description: |
        Releases the bucket's remaining TF with a Bucket Adjustment (BUA) to
        0, so the money becomes unallocated in the source account, then
        deletes the bucket. Its transactions stay.

        Releasing TF needs an active cycle (409 `no_active_cycle` or
        `cycle_overdue`); a bucket whose TF is already 0 can be deleted
        without one.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/{bucketId}/refill:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    post:
      operationId: refillBucket
      tags: [buckets]
      summary: Refill a bucket by hand
      description: |
        Refills a bucket with the *manual* refill mode now (spec §6). Without
        Keep funds, TF is set to the refill amount (REF = RA − TF). With Keep
        funds, the refill amount is added (REF = RA), and an Overflow (OVF)
        removes what TF then has above the capacity.

        A bucket is refilled at most once per cycle (409 `already_refilled`).
        Buckets with another refill mode get 409 `wrong_refill_mode`. Like
        every bucket transaction, it needs an active cycle (409
        `no_active_cycle` or `cycle_overdue`).
      responses:
        "200":
          description: The refilled bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/{bucketId}/adjustment:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    post:
      operationId: adjustBucket
      tags: [buckets]
      summary: Adjust a bucket's funds
      description: |
        The adjustment modes of Bucket setup (spec §9):

        - `temporary`: sets this cycle's TF to `target_funds` (0 or more)
          with a Budget Adjustment (BUA) for the difference. RA is unchanged.
        - `future`: sets RA to `refill_amount`; TF is unchanged and nothing
          is recorded. A fixed capacity below the new RA is raised to it.
        - `both`: sets RA to `refill_amount` and changes TF by the same
          amount (BUA). TF may go below 0.

        A BUA needs an active cycle (409 `no_active_cycle` or
        `cycle_overdue`). An adjustment that changes nothing is 400
        `no_change`.

        A `fully_manual` bucket (#76) has no refill amount, so it only takes
        `temporary`: its Add funds and Remove funds. With a fixed capacity,
        `target_funds` can't be above it (400 `invalid_request`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketAdjustment"
      responses:
        "200":
          description: The adjusted bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/{bucketId}/transfer:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    post:
      operationId: transferBucketFunds
      tags: [buckets]
      summary: Move funds to another bucket
      description: |
        Moves `amount` from this bucket to `to_bucket_id`, in the same
        currency (400 `currency_mismatch`), with the modes of
        `POST /buckets/{bucketId}/adjustment`:

        - `temporary`: moves TF with a Budget Adjustment Transfer (BAT). The
          sending bucket may go below 0.
        - `future`: moves RA; nothing is recorded. The sending bucket's RA
          must be at least `amount`.
        - `both`: moves RA and TF (BAT).

        Between buckets on the same account, the covered part (CAF) moves
        along with TF (spec §7).

        With a `fully_manual` bucket (#76) on either side, only `temporary`
        is allowed, and the receiving one's TF can't go above a fixed
        capacity (400 `invalid_request`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketTransfer"
      responses:
        "200":
          description: Both buckets after the move.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [from, to]
                properties:
                  from:
                    $ref: "#/components/schemas/Bucket"
                  to:
                    $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions
      description: |
        The user's transactions, newest first, one page at a time. Each is
        merged with its corrections: the lines show the effective amounts,
        and `corrected` and `reversed` say what happened to it. Filters
        combine with AND. Pass `next_cursor` as `cursor` to get the next page.
      parameters:
        - name: type
          in: query
          description: Only these types. Repeat for several (`?type=INC&type=EXP`).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TransactionType"
          style: form
          explode: true
        - name: account_id
          in: query
          description: Only transactions with a line on this account.
          schema:
            $ref: "#/components/schemas/AccountId"
        - name: bucket_id
          in: query
          description: Only transactions with a line on this bucket.
          schema:
            $ref: "#/components/schemas/BucketId"
        - name: cycle_id
          in: query
          description: Only transactions dated within this cycle.
          schema:
            $ref: "#/components/schemas/CycleId"
        - name: from
          in: query
          description: Only transactions at or after this moment.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only transactions before this moment.
          schema:
            type: string
            format: date-time
        - name: tag
          in: query
          description: Only transactions with this tag, ignoring case.
          schema:
            type: string
            maxLength: 50
        - name: counterparty
          in: query
          description: Only transactions whose counterparty contains this text, ignoring case.
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The previous page's `next_cursor`.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create an income, expense or transfer
      description: |
        Amounts are positive; the type gives the sign. An income (INC) adds
        `amount` to `account_id` and each bucket line to its bucket; an
        expense (EXP) takes them away. A transfer (TRF) moves `amount` from
        `account_id` to `to_account_id`, which must have the same currency
        (400 `currency_mismatch`), and has no bucket lines.

        Each bucket must be funded from `account_id`, and the bucket lines
        together can't exceed `amount`; the rest isn't tied to a bucket.
        Bucket lines need an active cycle that `at` falls in (409
        `no_active_cycle` or `cycle_overdue`, 400 `invalid_request` if `at` is
        outside it). `at` defaults to now and can't be in the future.

        An income can trigger the refill of its account's *on income*
        buckets: see `triggers_refill`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: The new transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction
      description: |
        The transaction merged with its corrections, plus its `history`: the
        original and each correction with its own lines. A correction's ID
        returns the transaction it corrects.
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions/{transactionId}/correction:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: correctTransaction
      tags: [transactions]
      summary: Correct a transaction
      description: |
        Records an adjustment that turns the transaction into the values
        given; omitted fields keep their current values, and `bucket_lines:
        []` removes all bucket lines. The adjustment holds the difference
        (100 corrected to 150 records +50) and keeps the original time. A
        correction's ID corrects the transaction it belongs to.

        Amounts are positive, as when creating, except for OPB and BLA: their
        `amount` is the signed balance amount, and only `amount`,
        `counterparty` and `tags` can change.

        A new `account_id` (or `to_account_id` for a transfer) moves the
        transaction: it is reversed and recorded again on the new account,
        and the response is the new transaction, whose `replaces` points to
        the old one. Refills the income triggered on the old account are
        undone, and it triggers them on the new one if it can.

        Bucket lines can only change while the original time is in the
        active cycle (409 `bucket_lines_locked`); the bank amount,
        counterparty and tags can change at any time. Only INC, EXP, TRF, OPB
        and BLA can be corrected (409 `not_correctable`), and not after a
        reversal (409 `already_reversed`). A correction that changes nothing
        gets 400 `no_change`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCorrection"
      responses:
        "200":
          description: The corrected transaction, or the new one after a move to another account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions/{transactionId}/reversal:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: reverseTransaction
      tags: [transactions]
      summary: Reverse a transaction
      description: |
        Records a reversal that cancels every effective line, at the original
        time. The transaction stays in the list, marked `reversed`. The same
        rules as for corrections apply: bucket lines must be in the active
        cycle (409 `bucket_lines_locked`), only INC, EXP, TRF, OPB and BLA
        (409 `not_correctable`), and only once (409 `already_reversed`).

        Reversing an income undoes the refills it triggered in the active
        cycle (their REF and OVF are reversed), so those buckets can be
        refilled again. Refills in a finished cycle stay.
      responses:
        "200":
          description: The reversed transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags:
    get:
      operationId: listTags
      tags: [transactions]
      summary: List tags
      description: |
        The user's tags, for autocompletion: most recently used first (by
        the time of the newest transaction with the tag), then unused ones
        by name.
      parameters:
        - name: q
          in: query
          description: Only tags whose name contains this text, ignoring case.
          schema:
            type: string
            maxLength: 50
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: The tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/counterparties:
    get:
      operationId: listCounterparties
      tags: [transactions]
      summary: List counterparties
      description: |
        Counterparties of the user's incomes and expenses, for
        autocompletion. Each is listed once (ignoring case, with its latest
        spelling), newest first, with what its newest transaction that
        isn't reversed used, so the Create transaction screen can fill it in
        again: the account, the tags and the buckets. The values are the
        effective ones, after corrections.
      parameters:
        - name: q
          in: query
          description: Only counterparties that contain this text, ignoring case.
          schema:
            type: string
            maxLength: 200
        - name: type
          in: query
          description: Only incomes or only expenses.
          schema:
            type: string
            enum: [INC, EXP]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The counterparties.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CounterpartySuggestion"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-bucky_session
      description: Session cookie set by `POST /api/v1/auth/login`. HttpOnly, so scripts can't read it.

  headers:
    SessionCookie:
      description: Sets or clears the `__Host-bucky_session` cookie.
      schema:
        type: string

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UserId"

    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountId"

    CycleId:
      name: cycleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CycleId"

    BucketId:
      name: bucketId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BucketId"

    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TransactionId"

  responses:
    Error:
      description: Any error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    UserId:
      type: string
      description: 6-digit user ID.
      pattern: "^[1-9][0-9]{5}$"
      example: "482913"

    Username:
      type: string
      description: 3–32 letters, digits, `.`, `_` or `-`. Unique, ignoring case.
      pattern: "^[A-Za-z0-9._-]{3,32}$"
      example: kari

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, active, admin, must_change_password, created_at, created_by, last_seen_at]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        username:
          $ref: "#/components/schemas/Username"
        active:
          type: boolean
          description: An inactive user can't log in.
        admin:
          type: boolean
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          allOf:
            - $ref: "#/components/schemas/UserId"
          nullable: true
          description: The admin who created the user; null for the initial admin.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: When the user last used the app, to the minute; null if they never logged in. Kept when their sessions end.

    UserCreate:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        admin:
          type: boolean
          default: false
        credential:
          $ref: "#/components/schemas/Credential"

    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        active:
          type: boolean
        admin:
          type: boolean

    Credential:
      type: string
      enum: [password, link]
      default: password
      description: |
        How the user gets in: `password`, a generated temporary password the
        admin hands over, which the user must change when they log in; or
        `link`, a link (valid 24 hours, once) where the user chooses their
        own password.

    CreatedUser:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        temporary_password:
          type: string
          description: With `credential` `password`. Shown once. The user must change it at first login.
        link:
          $ref: "#/components/schemas/PasswordLink"

    PasswordReset:
      type: object
      additionalProperties: false
      properties:
        credential:
          $ref: "#/components/schemas/Credential"

    NewCredential:
      type: object
      additionalProperties: false
      description: One of the two, as asked for. Shown once.
      properties:
        temporary_password:
          type: string
          description: The user must change it at their next login.
        link:
          $ref: "#/components/schemas/PasswordLink"

    PasswordLink:
      type: object
      additionalProperties: false
      description: |
        A setup or reset link. The app's link is `/set-password#<token>`; the
        token is in the fragment, so it isn't sent to servers or in Referer
        headers. Shown once.
      required: [token, expires_at]
      properties:
        token:
          $ref: "#/components/schemas/PasswordLinkToken"
        expires_at:
          type: string
          format: date-time

    PasswordLinkToken:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: 32 random bytes, base64url without padding.

    PasswordLinkCheck:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/PasswordLinkToken"

    PasswordLinkInfo:
      type: object
      additionalProperties: false
      required: [username, purpose, expires_at]
      properties:
        username:
          type: string
        purpose:
          type: string
          enum: [setup, reset]
          description: "`setup` for a new user, `reset` after an admin reset the password."
        expires_at:
          type: string
          format: date-time

    PasswordLinkUse:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          $ref: "#/components/schemas/PasswordLinkToken"
        new_password:
          type: string
          description: 12 to 72 bytes (UTF-8).
          minLength: 12
          maxLength: 72
          format: password

    User:
      type: object
      additionalProperties: false
      required: [id, username, admin, must_change_password, preferences]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        username:
          type: string
          example: admin
        admin:
          type: boolean
        must_change_password:
          type: boolean
          description: When true, the API refuses everything except changing the password (and `GET /me`, logout).
        preferences:
          $ref: "#/components/schemas/Preferences"

    Preferences:
      type: object
      additionalProperties: false
      description: Per-user settings. Missing or null fields use the default.
      properties:
        locale:
          type: string
          nullable: true
          description: BCP 47 language tag for number and date formats, e.g. `nb-NO`. Null means the browser's locale.
          pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
          maxLength: 35
          example: nb-NO
        language:
          type: string
          allOf:
            - $ref: "#/components/schemas/Language"
          nullable: true
          description: The web app's language. Null follows `locale` (`nb-NO` → `nb`, `nn-NO` → `nn`, others → `en`), or the browser's language when that's null too.
        default_refill_mode:
          type: string
          allOf:
            - $ref: "#/components/schemas/RefillMode"
          nullable: true
          description: The refill mode new buckets get when none is given. Null means `auto`.
        default_negative_tf:
          type: string
          allOf:
            - $ref: "#/components/schemas/NegativeTf"
          nullable: true
          description: The `negative_tf` new buckets get when none is given. Null means `debt`.
        income_refill_rules:
          type: array
          nullable: true
          maxItems: 20
          description: |
            An income from `counterparty` (the same text, ignoring case) of at
            least `min_amount` triggers the refill of its account's *on
            income* buckets, unless the income says otherwise with
            `triggers_refill` (spec §6). Null means no rules.
          items:
            $ref: "#/components/schemas/IncomeRefillRule"
        dashboard:
          type: object
          allOf:
            - $ref: "#/components/schemas/DashboardSettings"
          nullable: true
          description: The Dashboard's layout and widget settings. Replaced as a whole on update. Null means the default layout.
        time_zone:
          type: string
          nullable: true
          maxLength: 64
          description: |
            The user's IANA time zone, e.g. `Europe/Oslo` (400
            `invalid_request` for an unknown zone). The cycle rule plans
            cycles from local midnight in it. The web app sets it to the
            browser's zone when it's null.
          example: Europe/Oslo
        cycle_rule:
          type: object
          allOf:
            - $ref: "#/components/schemas/CycleRule"
          nullable: true
          description: |
            Plans cycles automatically (spec §3). Setting it needs a
            `time_zone` (400 `invalid_request`). Setting it or `time_zone`
            replans the cycles the rule planned that haven't been moved by
            hand or begun. Null means no rule; the planned cycles stay.
        whats_new_seen:
          type: string
          nullable: true
          description: |
            The last app version whose What's New the user was shown. The
            web app shows What's New when it opens a newer feature or major
            version.
          pattern: "^v\\d+\\.\\d{2}\\.\\d{2}$"
          example: v1.04.00
        whats_new_popup:
          type: boolean
          nullable: true
          description: Whether What's New pops up after an update. Null means true.
        saved_graphs:
          type: array
          nullable: true
          maxItems: 50
          description: |
            The graphs saved on Stats & reports (#122), in the order the
            user sees them. Each id is unique and each name is not blank
            (400 `invalid_request` otherwise). Replaced as a whole on update.
            Null means none.
          items:
            $ref: "#/components/schemas/SavedGraph"

    DashboardSettings:
      type: object
      additionalProperties: false
      description: |
        The Dashboard's layouts. When `widgets` is set, it is the desktop
        layout, in order (an empty list is an empty Dashboard). When it's
        missing or null, the web app shows the default five widgets, using
        the per-type objects (from before #37) as their settings.

        `mobile_widgets` (#99) is the layout for narrow screens. When it's
        missing or null, the web app shows a copy of the desktop layout, or
        its mobile default when nothing else is saved.
      properties:
        widgets:
          type: array
          nullable: true
          maxItems: 30
          description: |
            The desktop layout's widgets, in order. Each widget's id is
            unique in its list, and it only carries the settings object for
            its own `type` (400 `invalid_request` otherwise).
          items:
            $ref: "#/components/schemas/DashboardWidget"
        mobile_widgets:
          type: array
          nullable: true
          maxItems: 30
          description: The mobile layout's widgets, in order, checked like `widgets`.
          items:
            $ref: "#/components/schemas/DashboardWidget"
        cycle:
          $ref: "#/components/schemas/CycleWidgetSettings"
        accounts:
          $ref: "#/components/schemas/AccountsWidgetSettings"
        bucket_status:
          $ref: "#/components/schemas/BucketStatusWidgetSettings"
        recent_transactions:
          $ref: "#/components/schemas/RecentWidgetSettings"

    DashboardWidget:
      type: object
      additionalProperties: false
      required: [id, type, width]
      description: One widget on the Dashboard. A missing settings object means its defaults.
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,40}$"
          description: Made by the web app; unique in the layout.
        type:
          type: string
          enum: [cycle, health, bucket_status, accounts, recent_transactions, in_out]
        width:
          type: string
          enum: [half, full]
          description: Half or the full width of the Dashboard on wide screens.
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
          description: |
            A custom title (not blank). Null or missing means the automatic
            one: the bucket's or account's name for One bucket and One
            account, otherwise the widget's name.
        cycle:
          $ref: "#/components/schemas/CycleWidgetSettings"
        accounts:
          $ref: "#/components/schemas/AccountsWidgetSettings"
        bucket_status:
          $ref: "#/components/schemas/BucketStatusWidgetSettings"
        recent_transactions:
          $ref: "#/components/schemas/RecentWidgetSettings"
        in_out:
          $ref: "#/components/schemas/InOutWidgetSettings"

    CycleWidgetSettings:
      type: object
      additionalProperties: false
      required: [show_next]
      properties:
        show_next:
          type: boolean
          description: Also show the next planned cycle. True by default.

    AccountsWidgetSettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all, account]
          description: All accounts (the default), or only the one in `account_id`.
        account_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: The account shown in `account` mode.

    BucketStatusWidgetSettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [attention, all, most_used, account, bucket]
          description: |
            Which buckets the widget shows: the ones that need attention
            (the default), all of them, the most used ones, those of the
            account in `account_id` (#89), or the one in `bucket_id`.
        account_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: The account whose buckets `account` mode shows.
        bucket_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/BucketId"
          nullable: true
          description: The bucket shown in `bucket` mode.
        show_mode:
          type: boolean
          description: Show the mode above the buckets (e.g. *Needs attention*). True by default.

    InOutWidgetSettings:
      type: object
      additionalProperties: false
      required: [figures, period]
      description: |
        The In/out widget (#90): income, expenses and their balance over a
        period, on one account or on all accounts in the app's currency.
      properties:
        figures:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: The figures to show, in this order.
          items:
            type: string
            enum: [income, expenses, balance]
        period:
          type: string
          enum: [days, today, week, cycle, month, year]
          description: |
            The last `days` days (today included), today, this week, the
            active cycle, this month or this year, in the user's time zone.
        days:
          type: integer
          minimum: 1
          maximum: 366
          description: The number of days in `days` mode. 30 by default.
        account_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: |
            One account, whose transfers count as income and expenses. Null
            or missing means all accounts, without transfers.

    RecentWidgetSettings:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: How many transactions it shows. 5 by default.

    Language:
      type: string
      description: "A web app language: English, Norwegian bokmål or Norwegian nynorsk."
      enum: [en, nb, nn]

    CycleRule:
      type: object
      additionalProperties: false
      required: [day, shift, holidays, ahead]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: The day of the month a cycle starts. A day the month doesn't have is its last day.
        shift:
          type: string
          enum: [previous, next, none]
          description: Where the day moves when it's a weekend or a holiday.
        holidays:
          type: string
          enum: [none, "NO"]
          description: The holidays besides weekends. `NO` is Norwegian bank holidays, including 24 and 31 December.
        ahead:
          type: integer
          minimum: 1
          maximum: 12
          description: How many planned cycles to keep.

    CyclePeriodsRequest:
      type: object
      additionalProperties: false
      required: [rule]
      properties:
        rule:
          $ref: "#/components/schemas/CycleRule"
        from:
          type: string
          format: date
          description: The first period is the one containing this date. Defaults to today in the user's time zone.
        count:
          type: integer
          minimum: 1
          maximum: 12
          default: 4

    CyclePeriod:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: The period's last day.

    IncomeRefillRule:
      type: object
      additionalProperties: false
      required: [counterparty, min_amount]
      properties:
        counterparty:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        min_amount:
          type: string
          description: The smallest income that matches, at least 0.
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          example: "20000"

    AccountId:
      type: string
      description: 4-digit bank account ID.
      pattern: "^[1-9][0-9]{3}$"
      example: "4821"

    Amount:
      type: string
      description: An amount with at most 2 decimals, as a string.
      pattern: "^-?[0-9]{1,12}(\\.[0-9]{1,2})?$"
      example: "1234.50"

    Currency:
      type: string
      description: |
        ISO 4217 currency code. Only real currencies with at most 2 decimals
        are accepted (not e.g. XAU or KWD); others get 400 `invalid_request`.
      pattern: "^[A-Z]{3}$"
      example: NOK

    AccountName:
      type: string
      description: 1 to 100 characters after trimming. Unique among the user's accounts, ignoring case.
      minLength: 1
      maxLength: 100
      example: Main account

    AccountType:
      type: string
      enum: [usage, savings, bsu, fund, investment]

    Account:
      type: object
      additionalProperties: false
      required: [id, name, type, currency, balance, unallocated, expected_income, created_at]
      properties:
        id:
          $ref: "#/components/schemas/AccountId"
        name:
          type: string
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          $ref: "#/components/schemas/Currency"
        balance:
          $ref: "#/components/schemas/Amount"
        unallocated:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The part of the balance that backs no bucket, balance − Σ CAF of its buckets (spec §7). Negative when the account is overdrawn.
        expected_income:
          type: string
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: The income expected on the account per cycle, which Budget setup compares the buckets' refill amounts with (spec §9). Null until entered.
        created_at:
          type: string
          format: date-time

    AccountCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/AccountName"
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          $ref: "#/components/schemas/Currency"
        opening_balance:
          $ref: "#/components/schemas/Amount"
        opening_at:
          type: string
          format: date-time
          description: When the opening balance applies. Defaults to now.

    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/AccountName"
        type:
          $ref: "#/components/schemas/AccountType"
        expected_income:
          type: string
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: The income expected per cycle, at least 0. Null clears it.

    BalanceAdjustment:
      type: object
      additionalProperties: false
      required: [target_balance]
      properties:
        target_balance:
          $ref: "#/components/schemas/Amount"
        at:
          type: string
          format: date-time
          description: The moment the balance is correct for. Defaults to now.

    AccountDelete:
      type: object
      additionalProperties: false
      properties:
        remaining_funds:
          type: object
          additionalProperties: false
          required: [action]
          description: What happens to money left in the account. Only needed when the balance isn't 0.
          properties:
            action:
              type: string
              enum: [transfer, adjust]
              description: "`transfer` moves it to `to_account_id` (TRF); `adjust` records a balance adjustment to 0 (BLA)."
            to_account_id:
              $ref: "#/components/schemas/AccountId"
        bucket_sources:
          type: object
          description: A new source account for every bucket funded from this account, as bucket ID (10 digits) → account ID.
          additionalProperties:
            $ref: "#/components/schemas/AccountId"
          example:
            "4829131234": "5120"

    CycleId:
      type: string
      description: 12-digit cycle ID (the owner's user ID, then 6 digits).
      pattern: "^[1-9][0-9]{11}$"
      example: "482913000417"

    CycleState:
      type: string
      enum: [future, active, finished]

    Cycle:
      type: object
      additionalProperties: false
      required: [id, start_at, end_at, state, generated, created_at]
      properties:
        id:
          $ref: "#/components/schemas/CycleId"
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: Exclusive. For the active cycle this is the planned end; once it has passed, bucket transactions are refused until the cycle is extended or ended.
        state:
          $ref: "#/components/schemas/CycleState"
        generated:
          type: boolean
          description: The cycle rule planned it, and it hasn't been moved by hand since.
        created_at:
          type: string
          format: date-time

    CycleTimes:
      type: object
      additionalProperties: false
      required: [start_at, end_at]
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time

    CycleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time

    CycleEnd:
      type: object
      additionalProperties: false
      properties:
        start_next:
          type: boolean
          default: false
          description: When the next planned cycle begins later than this one ends, start it right away instead of leaving a gap.

    CycleEndResult:
      type: object
      additionalProperties: false
      required: [ended, started]
      properties:
        ended:
          $ref: "#/components/schemas/Cycle"
        started:
          type: object
          allOf:
            - $ref: "#/components/schemas/Cycle"
          nullable: true
          description: The cycle that started, or null if none did.

    CurrentCycles:
      type: object
      additionalProperties: false
      required: [active, next]
      properties:
        active:
          type: object
          allOf:
            - $ref: "#/components/schemas/Cycle"
          nullable: true
        next:
          type: object
          allOf:
            - $ref: "#/components/schemas/Cycle"
          nullable: true
          description: The earliest planned cycle.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        new_password:
          type: string
          description: 12 to 72 bytes (UTF-8), different from the current password.
          minLength: 12
          maxLength: 72
          format: password

    BucketId:
      type: string
      description: 10-digit bucket ID.
      pattern: "^[1-9][0-9]{9}$"
      example: "4829131234"

    BucketName:
      type: string
      description: 1 to 100 characters after trimming. Unique among the user's buckets, ignoring case.
      minLength: 1
      maxLength: 100
      example: Groceries

    CapMode:
      type: string
      enum: [multiplier, fixed, none]
      description: |
        How the Bucket Capacity (BC) is set: the refill amount times
        `cap_multiplier`, or the fixed `cap_amount`. `none` (no capacity) is
        for `fully_manual` buckets only, which can't use `multiplier`.

    CapMultiplier:
      type: string
      description: 1.00 or more, with at most 2 decimals, as a string.
      pattern: "^[0-9]{1,4}(\\.[0-9]{1,2})?$"
      example: "1.50"

    RefillMode:
      type: string
      enum: [auto, manual, on_income, fully_manual]
      description: |
        `auto` refills at cycle start, `manual` with a button once per cycle,
        `on_income` when income arrives. A `fully_manual` bucket (#76) is
        never refilled: its refill amount is 0, it always keeps its funds,
        and they only change through adjustments.

    NegativeTf:
      type: string
      enum: [debt, clear]
      description: |
        What a refill does with a negative TF (an overspent bucket, spec §6).
        Only used with `keep_funds`; without it the refill always sets TF to
        RA. `debt` adds RA as usual, so the overspend is paid back from the
        refill; `clear` brings TF to 0 first, so TF becomes RA.

    OverflowDestination:
      type: string
      enum: [unallocated, savings_distribution, savings_target]
      description: Where overflow goes. Only `unallocated` is available until the savings module; the others get 400.

    Bucket:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - source_account_id
        - currency
        - refill_amount
        - cap_mode
        - cap_multiplier
        - cap_amount
        - capacity
        - target_funds
        - current_available_funds
        - keep_funds
        - negative_tf
        - refill_mode
        - overflow_destination
        - priority
        - importance
        - refilled
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/BucketId"
        name:
          type: string
        source_account_id:
          $ref: "#/components/schemas/AccountId"
        currency:
          $ref: "#/components/schemas/Currency"
        refill_amount:
          $ref: "#/components/schemas/Amount"
        cap_mode:
          $ref: "#/components/schemas/CapMode"
        cap_multiplier:
          type: string
          allOf:
            - $ref: "#/components/schemas/CapMultiplier"
          nullable: true
          description: Set in the multiplier mode, otherwise null.
        cap_amount:
          type: string
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: Set in the fixed mode, otherwise null.
        capacity:
          type: string
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: The Bucket Capacity (BC), never below the refill amount. Null with the `none` capacity mode.
        target_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Target Funds (TF), the sum of the bucket's transactions.
        current_available_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: |
            Current Available Funds (CAF), what the source account actually
            backs. Set by the Money Allocation Routine (spec §7): below TF when
            the account can't cover all its buckets.
        keep_funds:
          type: boolean
        negative_tf:
          $ref: "#/components/schemas/NegativeTf"
        refill_mode:
          $ref: "#/components/schemas/RefillMode"
        overflow_destination:
          $ref: "#/components/schemas/OverflowDestination"
        priority:
          type: boolean
        importance:
          type: integer
          minimum: 1
          maximum: 10
        refilled:
          type: boolean
          description: |
            The bucket has been refilled in the active cycle (spec §6). A
            bucket is refilled at most once per cycle.
        created_at:
          type: string
          format: date-time

    AccountFlow:
      type: object
      additionalProperties: false
      description: An account's money in and out over a period. All amounts are positive or 0.
      required: [account_id, income, expenses, transfers_in, transfers_out]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountId"
        income:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Income (INC).
        expenses:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Expenses (EXP), as a positive amount.
        transfers_in:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Transfers into the account (TRF).
        transfers_out:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Transfers out of the account (TRF), as a positive amount.

    SavedGraph:
      type: object
      additionalProperties: false
      required: [id, name, graph]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 60
        graph:
          $ref: "#/components/schemas/GraphSettings"

    GraphSettings:
      type: object
      additionalProperties: false
      required: [kind, metric, period, resolution]
      description: |
        A line or bar graph on Stats & reports (#122): what it sums over
        which period, and how it's drawn. The fields after `resolution`
        match the Stats API's parameters and are left out when not used.
      properties:
        kind:
          type: string
          enum: [line, bar]
        metric:
          type: string
          enum: [spending, income, balance]
        period:
          type: string
          maxLength: 40
          description: |
            The period, relative to when the graph is shown:
            `last-<n>-days|weeks|months|cycles|years`, `current-<unit>` or
            `previous-<unit>` (unit `cycle`, `month`, `quarter`, `half_year`
            or `year`), one specific period (`day-<date>`, `week-<first
            day>`, `month-<yyyy-mm>`, `quarter-<yyyy>-q<1-4>`,
            `half_year-<yyyy>-h<1-2>`, `year-<yyyy>` or `cycle-<cycle ID>`),
            or `custom-<first day>-<last day>`.
          pattern: "^(last-[0-9]{1,3}-(days|weeks|months|cycles|years)|(current|previous)-(cycle|month|quarter|half_year|year)|(day|week)-[0-9]{4}-[0-9]{2}-[0-9]{2}|month-[0-9]{4}-[0-9]{2}|quarter-[0-9]{4}-q[1-4]|half_year-[0-9]{4}-h[12]|year-[0-9]{4}|cycle-[1-9][0-9]{11}|custom-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9]{2}-[0-9]{2})$"
          example: last-30-days
        resolution:
          type: string
          enum: [hour, day, week, month, year, cycle, total]
        group_by:
          type: string
          enum: [none, account, bucket]
        account_ids:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AccountId"
        bucket_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BucketId"
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        counterparty:
          type: string
          maxLength: 200
        cumulative:
          type: boolean
          description: Lines only. Running totals from the start of the period.
        side_by_side:
          type: boolean
          description: Bars only. Series side by side instead of stacked.
        stepped:
          type: boolean
          description: Lines only. Each interval's value is held until the next, instead of a straight line between points.
        fit_y_axis:
          type: boolean
          description: Fit the Y axis to the values instead of including 0 (the default).
        top:
          type: integer
          minimum: 1
          maximum: 8
          description: How many series get their own colour (at most 8, the graph palette); the rest add up to Other. 5 by default.

    StatsSeries:
      type: object
      additionalProperties: false
      description: A period cut into intervals, and one value per interval in each series.
      required: [intervals, series]
      properties:
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/StatsInterval"
        series:
          type: array
          description: Sorted by currency, then account or bucket ID (the series without a bucket last).
          items:
            $ref: "#/components/schemas/StatsSeriesLine"

    StatsInterval:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Exclusive.

    StatsSeriesLine:
      type: object
      additionalProperties: false
      required: [currency, values]
      properties:
        account_id:
          description: The account, when grouped by account.
          allOf:
            - $ref: "#/components/schemas/AccountId"
        bucket_id:
          type: string
          nullable: true
          description: The bucket, when grouped by bucket; null for the part on no bucket.
          allOf:
            - $ref: "#/components/schemas/BucketId"
        currency:
          $ref: "#/components/schemas/Currency"
        values:
          type: array
          description: One value per interval, in the same order.
          items:
            $ref: "#/components/schemas/Amount"

    BucketFigures:
      type: object
      additionalProperties: false
      description: |
        A bucket's figures for one cycle. The parts are signed: a reduction
        or a transfer out is negative. `budget` = `start` + `refills` +
        `income` + `opening_funds` + `adjustments` + `transfers`, and `left` =
        `budget` − `used` − `overflow`, which is the current TF while the cycle
        is active.
      required: [bucket_id, start, refills, income, opening_funds, adjustments, transfers, budget, used, overflow, left]
      properties:
        bucket_id:
          $ref: "#/components/schemas/BucketId"
        start:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: TF when the cycle began, from the lines of earlier cycles.
        refills:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Refills (REF).
        income:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Income put into the bucket (INC).
        opening_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Opening funds (OPF).
        adjustments:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Bucket adjustments (BUA).
        transfers:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Transfers to (positive) or from (negative) other buckets (BAT).
        budget:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What the bucket had to spend in the cycle.
        used:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What was spent (EXP, net of corrections), as a positive amount.
        overflow:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What overflowed (OVF), as a positive amount.
        left:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What's left at the end of the cycle.

    BucketCreate:
      type: object
      additionalProperties: false
      required: [name, source_account_id]
      properties:
        name:
          $ref: "#/components/schemas/BucketName"
        source_account_id:
          $ref: "#/components/schemas/AccountId"
        refill_amount:
          $ref: "#/components/schemas/Amount"
        cap_mode:
          $ref: "#/components/schemas/CapMode"
        cap_multiplier:
          $ref: "#/components/schemas/CapMultiplier"
        cap_amount:
          $ref: "#/components/schemas/Amount"
        keep_funds:
          type: boolean
        negative_tf:
          allOf:
            - $ref: "#/components/schemas/NegativeTf"
          description: Defaults to the user's `default_negative_tf` preference, or `debt`.
        refill_mode:
          allOf:
            - $ref: "#/components/schemas/RefillMode"
          description: Defaults to the user's `default_refill_mode` preference, or `auto`.
        overflow_destination:
          $ref: "#/components/schemas/OverflowDestination"
        priority:
          type: boolean
        importance:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        opening_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: >
            Recorded now as an Opening Funds (OPF) transaction when not 0.
            Needs an active cycle, and counts as the bucket's refill in it
            (spec §6), so no refill later in the cycle changes the amount.
        refill:
          type: boolean
          description: >
            Refill the bucket now in the active cycle (spec §6), whatever
            its refill mode except `fully_manual`, which is never refilled.
            It counts as the bucket's refill in that cycle. Needs an active
            cycle; can't be combined with `opening_funds`.

    AdjustmentMode:
      type: string
      enum: [temporary, future, both]
      description: "temporary: this cycle only (TF). future: from the next refill (RA). both: RA, and TF by the same amount."

    BucketAdjustment:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/AdjustmentMode"
        target_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The new TF, 0 or more. Only and always with `temporary`.
        refill_amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The new RA, 0 or more. Only and always with `future` and `both`.

    BucketTransfer:
      type: object
      additionalProperties: false
      required: [to_bucket_id, mode, amount]
      properties:
        to_bucket_id:
          $ref: "#/components/schemas/BucketId"
        mode:
          $ref: "#/components/schemas/AdjustmentMode"
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What to move, above 0.

    RefillAmounts:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [bucket_id, refill_amount]
            properties:
              bucket_id:
                $ref: "#/components/schemas/BucketId"
              refill_amount:
                $ref: "#/components/schemas/Amount"
        this_cycle:
          type: boolean
          default: false
          description: Also move TF in the active cycle by each refilled bucket's change in RA (BUA).

    BucketUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/BucketName"
        source_account_id:
          $ref: "#/components/schemas/AccountId"
        refill_amount:
          $ref: "#/components/schemas/Amount"
        cap_mode:
          $ref: "#/components/schemas/CapMode"
        cap_multiplier:
          $ref: "#/components/schemas/CapMultiplier"
        cap_amount:
          $ref: "#/components/schemas/Amount"
        keep_funds:
          type: boolean
        negative_tf:
          $ref: "#/components/schemas/NegativeTf"
        refill_mode:
          $ref: "#/components/schemas/RefillMode"
        overflow_destination:
          $ref: "#/components/schemas/OverflowDestination"
        priority:
          type: boolean
        importance:
          type: integer
          minimum: 1
          maximum: 10

    TransactionId:
      type: string
      description: 16-digit transaction ID. The first 8 digits are the UTC date of the transaction time.
      pattern: "^[0-9]{16}$"
      example: "2026102512345678"

    TransactionType:
      type: string
      enum: [OPB, BLA, INC, EXP, TRF, INP, OPF, REF, BUA, BAT, OVF]
      description: See spec §5.4. Only INC, EXP and TRF can be created with `POST /transactions`.

    CorrectionType:
      type: string
      enum: [none, adjustment, reversal]

    TransactionBankLine:
      type: object
      additionalProperties: false
      required: [account_id, amount]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountId"
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Signed, in the account's currency.

    TransactionBucketLine:
      type: object
      additionalProperties: false
      required: [bucket_id, cycle_id, amount]
      properties:
        bucket_id:
          $ref: "#/components/schemas/BucketId"
        cycle_id:
          $ref: "#/components/schemas/CycleId"
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Signed, in the bucket's currency.

    Transaction:
      type: object
      additionalProperties: false
      required: [id, type, at, counterparty, tags, triggers_refill, created_at, created_by, corrected, reversed, replaces, replaced_by, bank_lines, bucket_lines, before_reversal]
      properties:
        id:
          $ref: "#/components/schemas/TransactionId"
        type:
          $ref: "#/components/schemas/TransactionType"
        at:
          type: string
          format: date-time
          description: When the transaction happened.
        counterparty:
          type: string
          description: The effective counterparty, from the newest correction.
        tags:
          type: array
          description: The effective tags, from the newest correction.
          items:
            type: string
        triggers_refill:
          type: boolean
          description: An income that triggers the refill of its account's *on income* buckets, from the newest correction.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          nullable: true
          description: The user who entered it (6-digit user ID), or null for the system.
        corrected:
          type: boolean
          description: The transaction has adjustments.
        reversed:
          type: boolean
          description: The transaction has been reversed. Its effective lines are then empty.
        replaces:
          type: string
          nullable: true
          description: The transaction this one replaced when it was moved to another account.
        replaced_by:
          type: string
          nullable: true
          description: The transaction that replaced this one when it was moved to another account.
        bank_lines:
          type: array
          description: Effective amounts per account, the original plus its corrections. Lines that sum to 0 are left out.
          items:
            $ref: "#/components/schemas/TransactionBankLine"
        bucket_lines:
          type: array
          description: Effective amounts per bucket, the original plus its corrections. Lines that sum to 0 are left out.
          items:
            $ref: "#/components/schemas/TransactionBucketLine"
        before_reversal:
          description: |
            Set on a reversed transaction: its effective lines just before the
            reversal, so what it amounted to can still be shown. Null otherwise.
          type: object
          allOf:
            - $ref: "#/components/schemas/TransactionLines"
          nullable: true
        history:
          type: array
          description: Only from `GET /transactions/{id}`. The original and its corrections, oldest first.
          items:
            $ref: "#/components/schemas/TransactionVersion"

    TransactionVersion:
      type: object
      additionalProperties: false
      required: [id, correction_type, created_at, created_by, bank_lines, bucket_lines]
      properties:
        id:
          $ref: "#/components/schemas/TransactionId"
        correction_type:
          $ref: "#/components/schemas/CorrectionType"
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          nullable: true
        bank_lines:
          type: array
          items:
            $ref: "#/components/schemas/TransactionBankLine"
        bucket_lines:
          type: array
          items:
            $ref: "#/components/schemas/TransactionBucketLine"

    TransactionLines:
      type: object
      additionalProperties: false
      required: [bank_lines, bucket_lines]
      properties:
        bank_lines:
          type: array
          items:
            $ref: "#/components/schemas/TransactionBankLine"
        bucket_lines:
          type: array
          items:
            $ref: "#/components/schemas/TransactionBucketLine"

    TransactionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page. Null on the last page.

    TransactionCreate:
      type: object
      additionalProperties: false
      required: [type, account_id, amount]
      properties:
        type:
          type: string
          enum: [INC, EXP, TRF]
        at:
          type: string
          format: date-time
          description: When it happened. Defaults to now; can't be in the future.
        counterparty:
          type: string
          maxLength: 200
          description: The company or person on the other side.
        tags:
          type: array
          maxItems: 20
          description: Tag names. Existing tags are reused, ignoring case.
          items:
            type: string
            maxLength: 50
        triggers_refill:
          type: boolean
          description: |
            Only for an income: refill the *on income* buckets funded from
            the account that haven't been refilled in this cycle (spec §6).
            Omitted, the user's `income_refill_rules` decide; an explicit
            value overrides them. `true` needs the income to be in the active
            cycle (409 `refill_unavailable`).
        account_id:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: The account of an income or expense, or the sending account of a transfer.
        to_account_id:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: The receiving account of a transfer.
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Positive.
        bucket_lines:
          type: array
          description: For an income or expense, the parts that go to or come from buckets.
          items:
            type: object
            additionalProperties: false
            required: [bucket_id, amount]
            properties:
              bucket_id:
                $ref: "#/components/schemas/BucketId"
              amount:
                allOf:
                  - $ref: "#/components/schemas/Amount"
                description: Positive.

    Tag:
      type: object
      additionalProperties: false
      required: [name, last_used_at]
      properties:
        name:
          type: string
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: The time of the newest transaction with the tag; null if none has it.

    CounterpartySuggestion:
      type: object
      additionalProperties: false
      required: [counterparty, type, at, account_id, tags, bucket_ids]
      properties:
        counterparty:
          type: string
        type:
          type: string
          enum: [INC, EXP]
        at:
          type: string
          format: date-time
          description: The time of the newest transaction with it.
        account_id:
          $ref: "#/components/schemas/AccountId"
        tags:
          type: array
          items:
            type: string
        bucket_ids:
          type: array
          description: The buckets it had lines on, in order. They may since have been deleted.
          items:
            $ref: "#/components/schemas/BucketId"

    TransactionCorrection:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The desired values. Omitted fields keep their current values.
      properties:
        account_id:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: Moves the transaction to this account (reverse and re-create).
        to_account_id:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: Moves a transfer to this receiving account (reverse and re-create).
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Positive, except for OPB and BLA (signed).
        bucket_lines:
          type: array
          description: Replaces all bucket lines; an empty list removes them.
          items:
            type: object
            additionalProperties: false
            required: [bucket_id, amount]
            properties:
              bucket_id:
                $ref: "#/components/schemas/BucketId"
              amount:
                allOf:
                  - $ref: "#/components/schemas/Amount"
                description: Positive.
        counterparty:
          type: string
          maxLength: 200
        tags:
          type: array
          maxItems: 20
          description: Replaces all tags; an empty list removes them.
          items:
            type: string
            maxLength: 50
        triggers_refill:
          type: boolean
          description: |
            Only for an income. `true` refills its account's *on income*
            buckets now, if the income is in the active cycle (409
            `refill_unavailable` otherwise). `false` undoes the refills it
            triggered in the active cycle.

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI identifying the problem type. `about:blank` means the HTTP status says it all.
          example: about:blank
        title:
          type: string
          description: Short summary of the problem type. For `about:blank` this is the HTTP status text.
          example: Not Found
        status:
          type: integer
          description: HTTP status code.
          example: 404
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          description: Request path the problem occurred on.
          example: /api/v1/accounts/1234
        code:
          type: string
          description: Stable, machine-readable error code, such as `not_found` or `invalid_request`.
          example: not_found
        request_id:
          type: string
          description: Same as the `X-Request-ID` response header. Quote it when reporting a bug.
