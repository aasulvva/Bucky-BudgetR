openapi: 3.0.3
# 3.0.x, not 3.1: oapi-codegen only supports 3.0.

info:
  title: Bucky BudgetR API
  version: 0.1.0
  description: |
    REST API of Bucky BudgetR, a self-hosted envelope-style budgeting app.

    This file is the contract. The Go server code and the TypeScript client
    are generated from it (`make generate`), so change the API here first.

    Conventions:
    - Resources live under `/api/v1`. The health probes `/healthz` and
      `/readyz` are at the root.
    - IDs are JSON **strings** of digits. Some are too large for a JavaScript
      number.
    - Amounts are decimal **strings** such as `"1234.50"`, never floats.
    - Every error response is an RFC 9457 problem (`application/problem+json`,
      schema `Problem`).
    - Timestamps are RFC 3339 in UTC (`2026-10-25T14:03:00Z`). Clients show
      them in local time.

    Authentication: log in with `POST /api/v1/auth/login`. The session is an
    HttpOnly cookie (`__Host-bucky_session`) that the browser sends by itself.
    **Every POST, PUT, PATCH and DELETE must also carry the header
    `X-Bucky-CSRF: 1`** (CSRF protection), or it is rejected with 403.

    A user whose `must_change_password` is set may only call operations
    marked `x-allowed-before-password-change`; everything else gets 403
    `password_change_required`. Operations marked `x-admin-only` need an
    admin; others get 403 `admin_only`.

    Request bodies are limited to 1 MiB (413 `body_too_large`), except where
    an operation sets `x-max-body-bytes`.

servers:
  - url: /

# Everything requires a session unless an operation says otherwise.
security:
  - cookieAuth: []

tags:
  - name: system
    description: Health and readiness probes.
  - name: auth
    description: Login, logout and the current user.
  - name: accounts
    description: Bank accounts and their balances.
  - name: cycles
    description: Budget cycles and their lifecycle.
  - name: buckets
    description: Buckets, their settings and their funds.
  - name: transactions
    description: Income, expenses and transfers, and the transaction list.
  - name: admin
    description: User management, for admins only.
  - name: stats
    description: Aggregated series for graphs and reports (#119).
  - name: schedules
    description: Scheduled and recurring transactions and their approval queue (#31).
  - name: notifications
    description: Reminders and to-dos the app can't do for the user (#57).

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness probe
      description: Reports that the process is up. Checks nothing else.
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Error"

  /readyz:
    get:
      operationId: getReadyz
      tags: [system]
      summary: Readiness probe
      description: Reports whether the server can handle requests, that is, whether the database is reachable.
      security: []
      responses:
        "200":
          description: The server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: The database is not reachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      description: |
        Checks the credentials and starts a session (sets the session cookie).
        Wrong username, wrong password and inactive users all get the same 401.
        Repeated failures are rate limited with 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. If `must_change_password` is set, only changing the password is allowed until it is done.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          description: Too many failed attempts. Try again after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/password-link:
    post:
      operationId: checkPasswordLink
      tags: [auth]
      summary: Check a setup or reset link
      description: |
        Tells whether a link from an admin works, and for whom. An unknown,
        used or expired link, or one for an inactive user, is 404
        `invalid_link`. The token is sent in the body rather than the URL, so
        it stays out of logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLinkCheck"
      responses:
        "200":
          description: The link works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordLinkInfo"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/password-link/use:
    post:
      operationId: usePasswordLink
      tags: [auth]
      summary: Set a password with a link and log in
      description: |
        Sets the user's password with a setup or reset link, uses the link
        up, ends the user's other sessions and starts a session (sets the
        session cookie). A weak password is 400 `weak_password` and leaves
        the link working; a link that doesn't work is 404 `invalid_link`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLinkUse"
      responses:
        "200":
          description: Password set and logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      operationId: logout
      x-allowed-before-password-change: true
      tags: [auth]
      summary: Log out
      description: Ends the current session and clears the cookie.
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      operationId: getMe
      x-allowed-before-password-change: true
      tags: [auth]
      summary: The current user
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/password:
    post:
      operationId: changePassword
      x-allowed-before-password-change: true
      tags: [auth]
      summary: Change the password
      description: |
        Changes the current user's password, clears `must_change_password` and
        ends all of the user's other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/preferences:
    patch:
      operationId: updatePreferences
      tags: [auth]
      summary: Update preferences
      description: Merges the given fields into the stored preferences. `null` resets a field to its default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: The preferences after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/export:
    get:
      operationId: exportMyData
      tags: [auth]
      summary: Export all of my data
      description: |
        Everything the user has, as of one moment, as a file to keep or to
        import later or on another server (#36): accounts, cycles, buckets,
        tags, transactions with their lines, refills, schedules with their
        queue, dismissed notifications and the preferences (the dashboard
        too). Not the username, password or sessions. The rows are the
        database's, so numbers are exact; the file is readable financial
        data. Logged as the event `data.exported`.
      responses:
        "200":
          description: The export file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExport"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/import:
    post:
      operationId: importMyData
      tags: [auth]
      summary: Replace all of my data with an export
      description: |
        Replaces everything the user has with an export file's data, in one
        step (#36). The body is the file as it was downloaded, sent as
        `application/octet-stream` so that its numbers stay exact. The IDs
        are kept when the file is the user's own and no other user has them;
        otherwise everything gets new IDs. A file of a newer format is 409
        `export_too_new`; anything else that isn't an export is 400
        `invalid_export`. Logged as the event `data.imported`.
      x-max-body-bytes: 67108864
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: What was imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      x-admin-only: true
      tags: [admin]
      summary: List users
      description: Every user, sorted by username, with when they last used the app.
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      x-admin-only: true
      tags: [admin]
      summary: Create a user
      description: |
        Creates an active user who gets in with `credential`: a generated
        temporary password, which they must change at first login, or a setup
        link where they choose their own password. Either is returned only
        here. A taken username (ignoring case) is 409 `username_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: The user, and their temporary password or setup link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      x-admin-only: true
      tags: [admin]
      summary: Activate, deactivate, grant or revoke admin
      description: |
        Deactivating ends the user's sessions and blocks login; their data is
        kept. The last active admin can't be deactivated or demoted (409
        `last_admin`), and admins can't change themselves here (409
        `own_account`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{userId}/reset-password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: resetUserPassword
      x-admin-only: true
      tags: [admin]
      summary: Reset a user's password
      description: |
        Replaces the user's password at once and ends their sessions. They
        get back in with `credential` (by default a temporary password):
        a generated temporary password, which they must change at their next
        login, or a reset link where they choose a new one. Either is
        returned only here, and voids an earlier link. Admins change their
        own password with `POST /me/password` (409 `own_account`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "200":
          description: The temporary password or reset link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewCredential"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/logs:
    get:
      operationId: listLogEntries
      x-admin-only: true
      tags: [admin]
      summary: List the kept log entries
      description: |
        The Logs screen (#93). The app keeps warnings and errors (kind
        `log`), app events such as startup, migrations, cycle starts and
        scheduled transactions (`event`), and admin actions (`audit`), each
        for as long as the log settings say. Ordinary requests are only in
        the server's stdout log. Newest first; filters combine with AND. Pass
        `next_before` as `before` to get the next page. An error's
        `request_id` (its reference) finds every entry for that request.
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/LogKind"
        - name: min_level
          in: query
          description: Only entries at this level or above.
          schema:
            type: string
            enum: [warn, error]
        - name: from
          in: query
          description: Only entries at or after this moment.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only entries before this moment.
          schema:
            type: string
            format: date-time
        - name: user_id
          in: query
          description: Only entries of this user (the one who made the request, or the routine's user).
          schema:
            $ref: "#/components/schemas/UserId"
        - name: request_id
          in: query
          description: Only entries for this request (an error's reference).
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
        - name: q
          in: query
          description: Only entries whose message, event or attributes contain this text, ignoring case.
          schema:
            type: string
            maxLength: 200
        - name: before
          in: query
          description: Only entries before this one (the previous page's `next_before`).
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/log-settings:
    get:
      operationId: getLogSettings
      x-admin-only: true
      tags: [admin]
      summary: How long log entries are kept
      responses:
        "200":
          description: The retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSettings"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateLogSettings
      x-admin-only: true
      tags: [admin]
      summary: Set how long log entries are kept
      description: |
        Older entries are deleted within the hour. The change is recorded
        as an audit entry (`logs.settings_changed`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSettings"
      responses:
        "200":
          description: The new retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSettings"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/reports/pdf:
    post:
      operationId: exportReportPdf
      tags: [stats]
      summary: A report as a PDF
      description: |
        Renders a report (#127) as an A4 PDF: a cover page with its name,
        period, filters, modules, the username and when it was made, then
        its modules, with page numbers. A headless Chrome loads the app's
        print page with a short-lived, read-only render token and the
        asking browser's language, locale and time zone, so the PDF reads
        as the screen does. Without a renderer (`PDF_CHROME_URL` and
        `PDF_APP_URL` unset, or Chrome not reachable) it's 503
        `pdf_unavailable`; a page that fails or takes over a minute is 502
        `pdf_failed`; more than two at once is 429 `too_many_renders`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPdfRequest"
      responses:
        "200":
          description: The PDF.
          headers:
            Content-Disposition:
              description: '`attachment` with a file name from the report''s name.'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/reports/flows:
    get:
      operationId: listAccountFlows
      tags: [accounts]
      summary: Money in and out of each account over a period
      description: |
        For the Dashboard's In/out widget (#90): each account's income
        (INC), expenses (EXP) and transfers in and out (TRF) over [`from`,
        `to`). Expenses and transfers out are positive amounts, in the
        account's currency. A transaction counts on its original's date with
        its corrections, as the transaction list shows it, so a reversed one
        adds up to 0. Balance adjustments, opening balances and bucket-only
        lines don't count.

        Only accounts with such transactions are listed, sorted by ID.
        `from` must be before `to` (400 `invalid_request`).
      parameters:
        - name: from
          in: query
          required: true
          description: The start of the period (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: The end of the period (exclusive).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The flows, one per account with any.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountFlow"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/stats/series:
    get:
      operationId: getStatsSeries
      tags: [stats]
      summary: Spending, income or balances over a period, per interval
      description: |
        For graphs, reports and widgets (#121): `from`…`to` cut into
        intervals of `resolution`, with one sum per interval in each series.

        - **Intervals** are cut in local time (`time_zone`, else the user's
          preference, else UTC), with weeks starting on `week_start`. The
          first and last are cut at `from` and `to`. `cycle` gives one
          interval per cycle that overlaps the period (days outside any
          cycle aren't covered), `total` one for the whole period. At most
          1000 intervals (400 `too_many_intervals`).
        - **Spending** is expenses (EXP) as a positive amount, **income**
          is income (INC), net of corrections: a transaction counts on its
          original's date with its corrections, as the transaction list
          shows it, so a reversed one adds up to 0. With `transfers`,
          transfers (TRF) count too: money in as income, money out as
          spending (for a one-account graph, as #90 does).
        - **Balance** is each account's balance at the end of each interval:
          every line dated before it, of any type.
        - **Grouping:** `none` gives one series per currency, `account` one
          per account, `bucket` one per bucket plus one without a bucket
          (`bucket_id` null) for the part of expenses or income on no
          bucket. Spending and income by bucket, or with `bucket_id`, use
          the bucket lines; otherwise the bank lines. `balance` can't be
          grouped by bucket.
        - **Currencies** are never added up: each series has one currency.
        - **Filters** work as on the transaction list. Several values of a
          filter match any of them.

        Empty intervals are 0. `from` must be before `to` (400
        `invalid_request`).
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [spending, income, balance]
        - name: from
          in: query
          required: true
          description: The start of the period (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: The end of the period (exclusive).
          schema:
            type: string
            format: date-time
        - name: resolution
          in: query
          required: true
          schema:
            type: string
            enum: [hour, day, week, month, year, cycle, total]
        - name: time_zone
          in: query
          description: The IANA time zone the intervals are cut in. Defaults to the user's `time_zone` preference, else UTC.
          schema:
            type: string
            maxLength: 64
            example: Europe/Oslo
        - name: week_start
          in: query
          description: The first day of the week, 1 (Monday) to 7 (Sunday). Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 7
        - name: group_by
          in: query
          description: One series per currency (`none`, the default), per account, per bucket, or per counterparty (#170; not for `balance`), where the case and spaces at the ends of a counterparty don't count.
          schema:
            type: string
            enum: [none, account, bucket, counterparty]
        - name: account_id
          in: query
          description: Only these accounts' lines (or their buckets' lines). Repeat for several.
          schema:
            type: array
            maxItems: 50
            items:
              $ref: "#/components/schemas/AccountId"
          style: form
          explode: true
        - name: bucket_id
          in: query
          description: Only these buckets' lines. Repeat for several. Not for `balance`.
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/BucketId"
          style: form
          explode: true
        - name: tag
          in: query
          description: Only transactions with any of these tags, ignoring case. Repeat for several. Not for `balance`.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 50
          style: form
          explode: true
        - name: counterparty
          in: query
          description: Only transactions whose counterparty or description contains this text, ignoring case. Not for `balance`.
          schema:
            type: string
            maxLength: 200
        - name: transfers
          in: query
          description: Count transfers as income (in) and spending (out). Not for `balance`.
          schema:
            type: boolean
      responses:
        "200":
          description: The intervals and the series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSeries"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/stats/flows:
    get:
      operationId: getStatsFlows
      tags: [stats]
      summary: Money in and out of each bucket and account, per interval
      description: |
        For the In/out/balance report module (#126): `from`…`to` cut into
        intervals of `resolution` as `/stats/series` cuts them, with each
        bucket's and each account's money in and out per interval.

        - **Buckets:** the bucket lines by type: refills (REF), income
          (INC), opening funds (OPF), adjustments (BUA) and transfers (BAT)
          in or out by sign, spent (EXP) and overflow (OVF). `start` is the
          bucket's TF when the interval begins and `end` when it ends, so
          `start` + `in` − `out` = `end`.
        - **Accounts:** income (INC), expenses (EXP) and transfers (TRF) in
          and out. `start` is the account's balance when the interval
          begins and `end` when it ends (#187), dating each line by its
          family's original as the sums do, so `start` plus every line in
          the interval (opening balances and balance adjustments too) is
          `end`.
        - **Openings (#187):** when a bucket's opening funds (OPF) or an
          account's opening balance (OPB) are dated in an interval, that
          interval's `start` includes them, rather than `opening_funds` and
          `in` (or the account's lines), and `opened_at` says when. The
          intervals before are 0: nothing is known about them.
        - A transaction counts on its original's date with its
          corrections, as the transaction list shows it, so a reversed one
          adds up to 0. Amounts other than `start` and `end` are positive.
        - **Rows:** every bucket and account that isn't deleted, or the
          filtered ones (`account_id` matches a bucket's source account),
          with zeros when nothing happened. Sorted by ID.

        `from` must be before `to` (400 `invalid_request`).
      parameters:
        - name: from
          in: query
          required: true
          description: The start of the period (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: The end of the period (exclusive).
          schema:
            type: string
            format: date-time
        - name: resolution
          in: query
          required: true
          schema:
            type: string
            enum: [month, cycle, total]
        - name: time_zone
          in: query
          description: The IANA time zone the intervals are cut in. Defaults to the user's `time_zone` preference, else UTC.
          schema:
            type: string
            maxLength: 64
        - name: account_id
          in: query
          description: Only these accounts, and the buckets funded from them. Repeat for several.
          schema:
            type: array
            maxItems: 50
            items:
              $ref: "#/components/schemas/AccountId"
          style: form
          explode: true
        - name: bucket_id
          in: query
          description: Only these buckets. Repeat for several.
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/BucketId"
          style: form
          explode: true
      responses:
        "200":
          description: The intervals, and the buckets' and accounts' flows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsFlows"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List accounts
      description: The user's accounts that aren't deleted, sorted by name, each with its current balance.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      description: |
        Creates an account. A non-zero `opening_balance` is recorded as an
        Opening Balance (OPB) transaction at `opening_at` (default now).
        Names must be unique among the user's accounts (409 `name_taken`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get an account
      responses:
        "200":
          description: The account with its current balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Rename an account or change its type
      description: The currency can't be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{accountId}/balance-adjustment:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: adjustAccountBalance
      tags: [accounts]
      summary: Adjust the balance
      description: |
        Sets the balance as of `at` (default now) to `target_balance` by
        recording a Balance Adjustment (BLA) for the difference. Transactions
        at or before `at` count. 400 `no_change` if there is no difference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustment"
      responses:
        "200":
          description: The account with its current balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{accountId}/reallocate:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: reallocateAccount
      tags: [accounts]
      summary: Reallocate the account's money
      description: |
        Runs the Money Allocation Routine for the buckets funded from the
        account now (spec §7), splitting its money by TF, priority and
        importance. CAF otherwise only moves on the routine's triggers, so this
        reshares an underfunded account by hand, for example after a refill.
      responses:
        "200":
          description: The account, with what's unallocated now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{accountId}/delete:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      description: |
        Deletes the account after settling it, all at once:
        - every bucket funded from it either moves to the account given in
          `bucket_sources` or is deleted with it (`delete_buckets`, #137),
          otherwise 409 `account_has_buckets`. A bucket in both, or one not
          funded from the account, is 400 `invalid_request`;
        - a deleted bucket's remaining funds are released first, with a
          bucket adjustment (BUA), as `DELETE /buckets/{bucketId}` does; that
          needs a usable active cycle unless they're 0 (409
          `no_active_cycle` or `cycle_overdue`). The money they held is then
          part of the account's balance below;
        - money left in it is transferred (TRF) or adjusted away (BLA) as
          `remaining_funds` says, otherwise 409 `balance_not_zero`.

        If any step is refused, nothing changes. Money and buckets can only move
        to another account in the same currency (400 `currency_mismatch`).
        The account's transactions are kept.

        This is a POST rather than DELETE because it carries a body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDelete"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles:
    get:
      operationId: listCycles
      tags: [cycles]
      summary: List cycles
      description: All of the user's cycles, oldest first.
      responses:
        "200":
          description: The cycles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cycle"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCycle
      tags: [cycles]
      summary: Plan a cycle
      description: |
        Creates a future cycle from `start_at` up to, but not including,
        `end_at`. The UI sends the UTC moments of local midnight. The cycle
        must end in the future and can't overlap another of the user's
        cycles (409 `cycle_overlap`); it may start exactly where another ends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleTimes"
      responses:
        "201":
          description: The planned cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycle-rule/periods:
    post:
      operationId: cycleRulePeriods
      tags: [cycles]
      summary: Preview a cycle rule
      description: |
        The periods a cycle rule gives, as local dates, from the one
        containing `from`. Changes nothing; the rule needn't be saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CyclePeriodsRequest"
      responses:
        "200":
          description: The periods.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CyclePeriod"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/active:
    get:
      operationId: getCurrentCycles
      tags: [cycles]
      summary: The active and next cycle
      description: |
        The active cycle and the next planned one; either can be null. With no
        active cycle, the UI prompts the user to start `next` or plan a cycle.
      responses:
        "200":
          description: The current cycles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCycles"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/{cycleId}:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: getCycle
      tags: [cycles]
      summary: Get a cycle
      responses:
        "200":
          description: The cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCycle
      tags: [cycles]
      summary: Move or extend a cycle
      description: |
        A future cycle can change its start and end. The active cycle can only
        change its end, to a moment in the future and after its last bucket
        transaction: this is how an overdue cycle is extended. Planned
        cycles that would have no time left are deleted, and if the next one
        starts before the new end, its start moves to the new end; with a
        cycle rule, more are then planned. Finished cycles can't change (409
        `cycle_finished`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleUpdate"
      responses:
        "200":
          description: The updated cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCycle
      tags: [cycles]
      summary: Delete a planned cycle
      description: Only future cycles can be deleted (409 `cycle_not_future`).
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/{cycleId}/start:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    post:
      operationId: startCycle
      tags: [cycles]
      summary: Start a planned cycle
      description: |
        Starts the next planned cycle when the user has no active cycle (409
        `active_cycle_exists`). Only the earliest future cycle can be started
        (409 `not_next_cycle`). Started before its planned start, it starts
        now; otherwise it keeps its planned start. Runs the cycle-start
        routine.
      responses:
        "200":
          description: The started cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/{cycleId}/end:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    post:
      operationId: endCycle
      tags: [cycles]
      summary: End the active cycle
      description: |
        Runs the cycle-end routine and finishes the active cycle (409
        `cycle_not_active` otherwise).

        - **On time or late:** the cycle keeps its planned end. Cycles end on
          their intended dates.
        - **Early:** the cycle ends now (or just after its last bucket
          transaction, if that is later).

        The next planned cycle then starts if it begins where this one ended.
        If it begins later, it starts right away (its start moves to where
        this one ended) only with `start_next`; otherwise there is a gap with
        no active cycle, in which transactions can't have bucket lines.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleEnd"
      responses:
        "200":
          description: The ended cycle and the one that started, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleEndResult"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/cycles/{cycleId}/bucket-figures:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: listBucketFigures
      tags: [buckets]
      summary: The buckets' figures for a cycle
      description: |
        What happened to each bucket in the cycle (spec §4), for the Buckets
        screen's "used X of Y": its TF when the cycle began, what was put in
        or taken out by type, what was spent and what overflowed. Calculated
        from the bucket lines; lines from later cycles don't count, so a
        finished cycle's figures stay as they were.

        Every bucket that isn't deleted is listed, sorted by ID, with zeros
        when nothing happened to it. A cycle that isn't the user's gets 404.
      responses:
        "200":
          description: The figures, one per bucket.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BucketFigures"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets:
    get:
      operationId: listBuckets
      tags: [buckets]
      summary: List buckets
      description: The user's buckets that aren't deleted, sorted by name, each with its TF and CAF.
      responses:
        "200":
          description: The buckets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bucket"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBucket
      tags: [buckets]
      summary: Create a bucket
      description: |
        Creates a bucket funded from `source_account_id`, in that account's
        currency. Names must be unique among the user's buckets (409
        `name_taken`).

        A non-zero `opening_funds` is recorded now as an Opening Funds (OPF)
        transaction. Like every bucket transaction, that needs an active
        cycle: without one the answer is 409 `no_active_cycle`, and with an
        overdue one 409 `cycle_overdue`. Nothing is created then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketCreate"
      responses:
        "201":
          description: The new bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/refill-amounts:
    post:
      operationId: setRefillAmounts
      tags: [buckets]
      summary: Set several buckets' refill amounts at once
      description: |
        Budget setup's save (spec §9): sets each bucket's refill amount, all
        or nothing. By default it is the *Future* adjustment: TF is unchanged
        and no transaction is recorded. As with `PATCH /buckets/{bucketId}`, a
        fixed capacity below the new refill amount is raised to it.

        With `this_cycle` (#81) it is also *Both* for each bucket refilled in
        the active cycle: a BUA of the change in RA, so TF moves by the same
        amount (it may go below 0). A bucket not refilled yet this cycle only
        gets the new RA, which its refill then uses. Needs an active cycle
        (409 `no_active_cycle`) that hasn't run past its end (409).

        A bucket may appear once (400 `invalid_request`); an unknown or
        deleted bucket is 404. A `fully_manual` bucket has no refill amount
        (400 `invalid_request`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefillAmounts"
      responses:
        "200":
          description: The updated buckets, in the order given.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/{bucketId}:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    get:
      operationId: getBucket
      tags: [buckets]
      summary: Get a bucket
      responses:
        "200":
          description: The bucket with its TF and CAF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateBucket
      tags: [buckets]
      summary: Change a bucket's settings
      description: |
        The source account can only change to an account in the same currency
        (400 `currency_mismatch`). Changing it resets CAF to 0 until the
        allocation routine funds the bucket from the new account.

        Switching `cap_mode` without the new mode's value uses multiplier 1,
        or a fixed amount equal to the refill amount. A fixed capacity below
        the refill amount is raised to it.

        Switching to `fully_manual` (#76) sets the refill amount to 0, turns
        `keep_funds` on and makes a multiplier capacity `none`; TF stays.
        Asking for a refill amount above 0, `keep_funds: false` or the
        multiplier capacity in the same request is 400. Switching away from
        it with no capacity uses multiplier 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketUpdate"
      responses:
        "200":
          description: The updated bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBucket
      tags: [buckets]
      summary: Delete a bucket
      description: |
        Releases the bucket's remaining TF with a Bucket Adjustment (BUA) to
        0, so the money becomes unallocated in the source account, then
        deletes the bucket. Its transactions stay.

        Releasing TF needs an active cycle (409 `no_active_cycle` or
        `cycle_overdue`); a bucket whose TF is already 0 can be deleted
        without one.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/{bucketId}/refill:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    post:
      operationId: refillBucket
      tags: [buckets]
      summary: Refill a bucket by hand
      description: |
        Refills a bucket with the *manual* refill mode now (spec §6). Without
        Keep funds, TF is set to the refill amount (REF = RA − TF). With Keep
        funds, the refill amount is added (REF = RA), and an Overflow (OVF)
        removes what TF then has above the capacity.

        A bucket is refilled at most once per cycle (409 `already_refilled`).
        Buckets with another refill mode get 409 `wrong_refill_mode`. Like
        every bucket transaction, it needs an active cycle (409
        `no_active_cycle` or `cycle_overdue`).
      responses:
        "200":
          description: The refilled bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/{bucketId}/adjustment:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    post:
      operationId: adjustBucket
      tags: [buckets]
      summary: Adjust a bucket's funds
      description: |
        The adjustment modes of Bucket setup (spec §9):

        - `temporary`: sets this cycle's TF to `target_funds` (0 or more)
          with a Budget Adjustment (BUA) for the difference. RA is unchanged.
        - `future`: sets RA to `refill_amount`; TF is unchanged and nothing
          is recorded. A fixed capacity below the new RA is raised to it.
        - `both`: sets RA to `refill_amount` and changes TF by the same
          amount (BUA). TF may go below 0.

        A BUA needs an active cycle (409 `no_active_cycle` or
        `cycle_overdue`). An adjustment that changes nothing is 400
        `no_change`.

        A `fully_manual` bucket (#76) has no refill amount, so it only takes
        `temporary`: its Add funds and Remove funds. With a fixed capacity,
        `target_funds` can't be above it (400 `invalid_request`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketAdjustment"
      responses:
        "200":
          description: The adjusted bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buckets/{bucketId}/transfer:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    post:
      operationId: transferBucketFunds
      tags: [buckets]
      summary: Move funds to another bucket
      description: |
        Moves `amount` from this bucket to `to_bucket_id`, in the same
        currency (400 `currency_mismatch`), with the modes of
        `POST /buckets/{bucketId}/adjustment`:

        - `temporary`: moves TF with a Budget Adjustment Transfer (BAT). The
          sending bucket may go below 0.
        - `future`: moves RA; nothing is recorded. The sending bucket's RA
          must be at least `amount`.
        - `both`: moves RA and TF (BAT).

        Between buckets on the same account, the covered part (CAF) moves
        along with TF (spec §7).

        With a `fully_manual` bucket (#76) on either side, only `temporary`
        is allowed, and the receiving one's TF can't go above a fixed
        capacity (400 `invalid_request`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketTransfer"
      responses:
        "200":
          description: Both buckets after the move.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [from, to]
                properties:
                  from:
                    $ref: "#/components/schemas/Bucket"
                  to:
                    $ref: "#/components/schemas/Bucket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions
      description: |
        The user's transactions, newest first (or oldest first with
        `order`), one page at a time. Each is
        merged with its corrections: the lines show the effective amounts,
        and `corrected` and `reversed` say what happened to it. Filters
        combine with AND; several values of one filter match any of them
        (#126). Pass `next_cursor` as `cursor` to get the next page.
      parameters:
        - name: type
          in: query
          description: Only these types. Repeat for several (`?type=INC&type=EXP`).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TransactionType"
          style: form
          explode: true
        - name: account_id
          in: query
          description: |
            Only transactions with a line on one of these accounts. Repeat
            for several. `balances_after` is only filled with exactly one.
          schema:
            type: array
            maxItems: 50
            items:
              $ref: "#/components/schemas/AccountId"
          style: form
          explode: true
        - name: bucket_id
          in: query
          description: Only transactions with a line on one of these buckets. Repeat for several.
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/BucketId"
          style: form
          explode: true
        - name: cycle_id
          in: query
          description: Only transactions dated within this cycle.
          schema:
            $ref: "#/components/schemas/CycleId"
        - name: from
          in: query
          description: Only transactions at or after this moment.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only transactions before this moment.
          schema:
            type: string
            format: date-time
        - name: tag
          in: query
          description: Only transactions with any of these tags, ignoring case. Repeat for several.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 50
          style: form
          explode: true
        - name: counterparty
          in: query
          description: Only transactions whose counterparty or description contains this text, ignoring case.
          schema:
            type: string
            maxLength: 200
        - name: counterparty_is
          in: query
          description: Only transactions whose effective counterparty is exactly this, ignoring case and spaces at the ends (#170).
          schema:
            type: string
            maxLength: 200
        - name: reversed
          in: query
          schema:
            type: boolean
          description: |
            `true` lists only reversed transactions (moved originals too, as
            moving reverses the original), `false` only the others. Omitted,
            both.
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The previous page's `next_cursor`, with the same `order`.
          schema:
            type: string
            maxLength: 100
        - name: order
          in: query
          description: Newest first (the default) or oldest first (#126).
          schema:
            type: string
            enum: [newest, oldest]
      responses:
        "200":
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create an income, expense or transfer
      description: |
        Amounts are positive; the type gives the sign. An income (INC) adds
        `amount` to `account_id` and each bucket line to its bucket; an
        expense (EXP) takes them away. A transfer (TRF) moves `amount` from
        `account_id` to `to_account_id`, which must have the same currency
        (400 `currency_mismatch`), and has no bucket lines.

        Each bucket must be funded from `account_id`, and the bucket lines
        together can't exceed `amount`; the rest isn't tied to a bucket.
        Bucket lines need an active cycle that `at` falls in (409
        `no_active_cycle` or `cycle_overdue`, 400 `invalid_request` if `at` is
        outside it). `at` defaults to now and can't be in the future.

        An income can trigger the refill of its account's *on income*
        buckets: see `triggers_refill`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: The new transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Count and sum transactions
      description: |
        How many of the user's transactions match the filters (the same as
        the list's), and their in, out and net per currency (#203), counted
        as the list shows them, merged with their corrections, and as a
        report's section summary (#191) adds them up:

        - Reversed and moved transactions aren't counted.
        - A transaction's amount is its bank lines' if it has any, else its
          bucket lines'. One line counts with its sign.
        - With several lines (a transfer between accounts or buckets), only
          the line of the one account (with exactly one `account_id`) or
          the one bucket (with exactly one `bucket_id`) counts. Without
          one, the transaction is counted but adds nothing.
        - A bank line is in its account's currency, and a bucket line in its
          bucket's source account's.
      parameters:
        - name: type
          in: query
          description: Only these types. Repeat for several (`?type=INC&type=EXP`).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TransactionType"
          style: form
          explode: true
        - name: account_id
          in: query
          description: |
            Only transactions with a line on one of these accounts. Repeat
            for several. With exactly one, a transfer's line on it counts.
          schema:
            type: array
            maxItems: 50
            items:
              $ref: "#/components/schemas/AccountId"
          style: form
          explode: true
        - name: bucket_id
          in: query
          description: |
            Only transactions with a line on one of these buckets. Repeat for
            several. With exactly one, a transfer's line on it counts.
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/BucketId"
          style: form
          explode: true
        - name: cycle_id
          in: query
          description: Only transactions dated within this cycle.
          schema:
            $ref: "#/components/schemas/CycleId"
        - name: from
          in: query
          description: Only transactions at or after this moment.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only transactions before this moment.
          schema:
            type: string
            format: date-time
        - name: tag
          in: query
          description: Only transactions with any of these tags, ignoring case. Repeat for several.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 50
          style: form
          explode: true
        - name: counterparty
          in: query
          description: Only transactions whose counterparty or description contains this text, ignoring case.
          schema:
            type: string
            maxLength: 200
        - name: counterparty_is
          in: query
          description: Only transactions whose effective counterparty is exactly this, ignoring case and spaces at the ends (#170).
          schema:
            type: string
            maxLength: 200
        - name: reversed
          in: query
          schema:
            type: boolean
          description: |
            As the list's. Reversed and moved transactions are never counted,
            so this changes nothing but is accepted, so the list's query can
            be passed as it is.
      responses:
        "200":
          description: The count and the sums.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction
      description: |
        The transaction merged with its corrections, plus its `history`: the
        original and each correction with its own lines. A correction's ID
        returns the transaction it corrects.
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions/{transactionId}/correction:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: correctTransaction
      tags: [transactions]
      summary: Correct a transaction
      description: |
        Records an adjustment that turns the transaction into the values
        given; omitted fields keep their current values, and `bucket_lines:
        []` removes all bucket lines. The adjustment holds the difference
        (100 corrected to 150 records +50) and keeps the original time. A
        correction's ID corrects the transaction it belongs to.

        Amounts are positive, as when creating, except for OPB and BLA: their
        `amount` is the signed balance amount, and only `amount`,
        `counterparty`, `description` and `tags` can change.

        A new `account_id` (or `to_account_id` for a transfer) moves the
        transaction: it is reversed and recorded again on the new account,
        and the response is the new transaction, whose `replaces` points to
        the old one. Refills the income triggered on the old account are
        undone, and it triggers them on the new one if it can.

        Bucket lines can only change while the original time is in the
        active cycle (409 `bucket_lines_locked`); the bank amount,
        counterparty, description and tags can change at any time. Only INC, EXP, TRF, OPB
        and BLA can be corrected (409 `not_correctable`), and not after a
        reversal (409 `already_reversed`). A correction that changes nothing
        gets 400 `no_change`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCorrection"
      responses:
        "200":
          description: The corrected transaction, or the new one after a move to another account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions/{transactionId}/reversal:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: reverseTransaction
      tags: [transactions]
      summary: Reverse a transaction
      description: |
        Records a reversal that cancels every effective line, at the original
        time. The transaction stays in the list, marked `reversed`. The same
        rules as for corrections apply: bucket lines must be in the active
        cycle (409 `bucket_lines_locked`), only INC, EXP, TRF, OPB and BLA
        (409 `not_correctable`), and only once (409 `already_reversed`).

        Reversing an income undoes the refills it triggered in the active
        cycle (their REF and OVF are reversed), so those buckets can be
        refilled again. Refills in a finished cycle stay.
      responses:
        "200":
          description: The reversed transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transactions/counterparty-rename:
    post:
      operationId: renameCounterparty
      tags: [transactions]
      summary: Rename a counterparty on several transactions
      description: |
        Changes the counterparty of an account's transactions whose effective
        counterparty is one of `from` (trimmed, ignoring case) to `to`, each by
        a correction (an adjustment with no amounts), so the change shows in
        its history. Only transactions that aren't reversed count, and only
        those of `type` and with `tag` when given. Used when an account gets a
        bank (#70): its earlier interest, registered as "Interest" or under the
        old bank, can take the bank's name.

        Without `apply` nothing changes, and `count` says how many would. With
        it, all of them are corrected together and `count` says how many
        were. Another user's account matches nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterpartyRename"
      responses:
        "200":
          description: How many transactions match, or were corrected.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [count]
                properties:
                  count:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags:
    get:
      operationId: listTags
      tags: [transactions]
      summary: List tags
      description: |
        The user's tags, for autocompletion: most recently used first (by
        the time of the newest transaction with the tag), then unused ones
        by name.
      parameters:
        - name: q
          in: query
          description: Only tags whose name contains this text, ignoring case.
          schema:
            type: string
            maxLength: 50
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: The tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/counterparties:
    get:
      operationId: listCounterparties
      tags: [transactions]
      summary: List counterparties
      description: |
        Counterparties of the user's incomes and expenses, for
        autocompletion. Each is listed once (ignoring case, with its latest
        spelling), newest first, with what its newest transaction that
        isn't reversed used, so the Create transaction screen can fill it in
        again: the account, the tags and the buckets. The values are the
        effective ones, after corrections.
      parameters:
        - name: q
          in: query
          description: Only counterparties that contain this text, ignoring case.
          schema:
            type: string
            maxLength: 200
        - name: type
          in: query
          description: Only incomes or only expenses.
          schema:
            type: string
            enum: [INC, EXP]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The counterparties.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CounterpartySuggestion"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List schedules
      description: The user's schedules, the next due first, then the ones that have ended.
      responses:
        "200":
          description: The schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Schedule a transaction
      description: |
        Schedules an income, expense or transfer once, or every `every`
        days, weeks, months or years from `start_date`, at `time` in
        `time_zone`. Monthly and yearly ones keep the start date's day,
        using the last day of shorter months. It ends never, after
        `end_count` occurrences (counted from the start date) or after the
        one on `end_date`.

        The transaction is checked like `POST /transactions` (400
        `invalid_request` or `currency_mismatch`). The first occurrence is
        the first at or after now; earlier ones aren't recorded, and a
        schedule with none left is 400.

        When an occurrence comes due, an `auto` schedule records it, dated
        at its scheduled time, with its bucket lines in the active cycle and
        the usual refill rules. An `approve` schedule queues it `due_days`
        days before its time, so it can be approved early; it's due at its
        time and overdue after. An occurrence that can't be recorded (no active
        cycle, a time outside it, an account or bucket that's gone) is
        queued too, with the reason: see `GET /scheduled-transactions`.

        With `record_first`, a first occurrence (at `start_date` and `time`)
        that is at or before now is recorded now, dated then, and the
        schedule goes on from the next at or after now: a transaction
        entered and set to repeat. It's checked like `POST /transactions`
        (an `auto` schedule or not), and if it can't be recorded, nothing is
        saved. A first occurrence in the future is left to the schedule.
      parameters:
        - name: record_first
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/schedules/preview:
    post:
      operationId: previewSchedule
      tags: [schedules]
      summary: Preview a repeat
      description: |
        The times of the first `count` occurrences at or after now of a
        schedule with this repeat, which needn't be saved: what a schedule
        form shows. The repeat is checked as for `POST /schedules`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePreview"
      responses:
        "200":
          description: The times, earliest first. Empty when none are left.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date-time
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: Get a schedule
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateSchedule
      tags: [schedules]
      summary: Change a schedule
      description: |
        Replaces the schedule's settings, checked as for a new one. Its next
        occurrence is then the first at or after now, so resuming a paused
        schedule doesn't record the ones it missed. A schedule with no
        occurrences left stays, ended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: The changed schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule
      description: Deletes the schedule and its occurrences, queued ones too. The transactions it recorded stay.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/schedules/{scheduleId}/upcoming:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      operationId: listUpcoming
      tags: [schedules]
      summary: The next occurrences of a schedule
      description: |
        The times of the schedule's next occurrences, from its next one (a
        paused schedule from now). Empty when it has ended.
      parameters:
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: The times, earliest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date-time
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/scheduled-transactions:
    get:
      operationId: listScheduledTransactions
      tags: [schedules]
      summary: List scheduled transactions that came due
      description: |
        The occurrences of the user's schedules that came due, newest first,
        one page at a time: `applied` ones with the transaction they
        recorded, `queued` ones waiting for approval with the reason and due
        time, and `skipped` ones. Pass `next_cursor` as `cursor` to get the
        next page.
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ScheduledTransactionState"
        - name: schedule_id
          in: query
          schema:
            $ref: "#/components/schemas/ScheduleId"
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The previous page's `next_cursor`.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: A page of scheduled transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledTransactionPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/scheduled-transactions/{scheduledTransactionId}:
    parameters:
      - $ref: "#/components/parameters/ScheduledTransactionId"
    get:
      operationId: getScheduledTransaction
      tags: [schedules]
      summary: Get a scheduled transaction that came due
      responses:
        "200":
          description: The scheduled transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledTransaction"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/scheduled-transactions/{scheduledTransactionId}/approve:
    parameters:
      - $ref: "#/components/parameters/ScheduledTransactionId"
    post:
      operationId: approveScheduledTransaction
      tags: [schedules]
      summary: Approve a queued scheduled transaction
      description: |
        Records a queued one and marks it `applied`. Without a body, it
        records the schedule's transaction as it is, dated at its scheduled
        time if that has passed and the active cycle holds it, else now
        (approved early, it's dated now). With a body, it records that
        instead (the user's edits), checked like `POST /transactions`.
        If it can't be recorded, nothing changes and the error says why (for
        example 409 `no_active_cycle`). One that isn't queued is 409
        `already_resolved`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "200":
          description: The applied scheduled transaction and the transaction it recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedScheduledTransaction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/scheduled-transactions/{scheduledTransactionId}/skip:
    parameters:
      - $ref: "#/components/parameters/ScheduledTransactionId"
    post:
      operationId: skipScheduledTransaction
      tags: [schedules]
      summary: Skip a queued scheduled transaction
      description: Marks a queued one `skipped`; it's never recorded. One that isn't queued is 409 `already_resolved`.
      responses:
        "200":
          description: The skipped scheduled transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledTransaction"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/upcoming-transactions:
    get:
      operationId: listUpcomingTransactions
      tags: [schedules]
      summary: What the schedules record next
      description: |
        The next times any of the user's schedules comes due, earliest
        first, from each one's next occurrence. Paused and ended schedules
        are left out.
      parameters:
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: The upcoming times.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingTransaction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: The user's open notifications
      description: |
        Worked out from the user's data when read, so a notification goes
        away by itself once its task is done (the queue approved, the
        balance adjusted, the bucket covered). Dismissed ones and kinds
        switched off in `preferences.notifications` are left out. Alerts
        come first, then warnings, then the rest, each oldest first.

        - `approval_queue`: scheduled transactions waiting for approval,
          one for all of them, with `count` and `overdue`.
        - `upcoming_bill`: an expense or transfer a schedule records within
          `upcoming_days`, with `schedule_id`, `at`, `amount` and `currency`.
        - `investment_balance`: an investment or fund account with no
          balance adjustment since the active cycle started, with
          `account_id` and `cycle_id`.
        - `bucket_uncovered`: a priority bucket whose CAF is below its TF,
          with `bucket_id` and the missing `amount` and `currency`.
      responses:
        "200":
          description: The open notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/notifications/dismiss:
    post:
      operationId: dismissNotification
      tags: [notifications]
      summary: Dismiss a notification, or mark it done
      description: |
        Hides the notification with this key until it happens again: the
        key names what it's about (the newest queued transaction, the
        bill's time, the cycle and account, the bucket). Once a dismissed
        one no longer applies, the dismissal is forgotten, so an uncovered
        bucket shows again the next time it's uncovered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDismiss"
      responses:
        "204":
          description: Dismissed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-bucky_session
      description: Session cookie set by `POST /api/v1/auth/login`. HttpOnly, so scripts can't read it.

  headers:
    SessionCookie:
      description: Sets or clears the `__Host-bucky_session` cookie.
      schema:
        type: string

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UserId"

    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountId"

    CycleId:
      name: cycleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CycleId"

    BucketId:
      name: bucketId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BucketId"

    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TransactionId"

    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ScheduleId"
    ScheduledTransactionId:
      name: scheduledTransactionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ScheduledTransactionId"

  responses:
    Error:
      description: Any error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    UserId:
      type: string
      description: 6-digit user ID.
      pattern: "^[1-9][0-9]{5}$"
      example: "482913"

    Username:
      type: string
      description: 3–32 letters, digits, `.`, `_` or `-`. Unique, ignoring case.
      pattern: "^[A-Za-z0-9._-]{3,32}$"
      example: kari

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, active, admin, must_change_password, created_at, created_by, last_seen_at]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        username:
          $ref: "#/components/schemas/Username"
        active:
          type: boolean
          description: An inactive user can't log in.
        admin:
          type: boolean
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          allOf:
            - $ref: "#/components/schemas/UserId"
          nullable: true
          description: The admin who created the user; null for the initial admin.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: When the user last used the app, to the minute; null if they never logged in. Kept when their sessions end.

    LogKind:
      type: string
      enum: [log, event, audit]
      description: "`log` is a warning or error, `event` an app event, `audit` an admin action."

    LogEntry:
      type: object
      additionalProperties: false
      required: [id, at, level, kind, message, attrs]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        kind:
          $ref: "#/components/schemas/LogKind"
        message:
          type: string
        event:
          type: string
          description: The event or admin action, e.g. `cycle.started` or `user.created`.
        request_id:
          type: string
          description: The request it belongs to, the reference an error shows.
        user_id:
          $ref: "#/components/schemas/UserId"
        username:
          type: string
          description: The user's name, when the user exists.
        attrs:
          type: object
          additionalProperties: true
          description: The rest of the record (method, path, status, error, stack, …). Never passwords, tokens or amounts.

    LogPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        next_before:
          type: integer
          format: int64
          description: Pass as `before` for the next page; absent on the last page.

    LogSettings:
      type: object
      additionalProperties: false
      required: [event_days, error_days, audit_days]
      properties:
        event_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: How many days app events are kept.
        error_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: How many days warnings and errors are kept.
        audit_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: How many days admin actions are kept.

    UserDataExport:
      type: object
      required: [app, format, schema_version, exported_at, user_id, username, data]
      properties:
        app:
          type: string
          enum: [bucky-budgetr]
        format:
          type: integer
          description: The file format. Bumped when a column is renamed or removed; older formats are converted on import.
        schema_version:
          type: integer
          format: int64
          description: The database schema version it was exported from, for information.
        exported_at:
          type: string
          format: date-time
        user_id:
          $ref: "#/components/schemas/UserId"
        username:
          type: string
        data:
          type: object
          required: [preferences, tables]
          properties:
            preferences:
              type: object
              additionalProperties: true
            tables:
              type: object
              description: Each per-user table's rows, by column.
              additionalProperties:
                type: array
                items:
                  type: object
                  additionalProperties: true

    ImportResult:
      type: object
      additionalProperties: false
      required: [accounts, buckets, cycles, transactions, schedules]
      properties:
        accounts:
          type: integer
        buckets:
          type: integer
        cycles:
          type: integer
        transactions:
          type: integer
          description: Transactions, not counting their corrections and reversals.
        schedules:
          type: integer

    UserCreate:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        admin:
          type: boolean
          default: false
        credential:
          $ref: "#/components/schemas/Credential"

    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        active:
          type: boolean
        admin:
          type: boolean

    Credential:
      type: string
      enum: [password, link]
      default: password
      description: |
        How the user gets in: `password`, a generated temporary password the
        admin hands over, which the user must change when they log in; or
        `link`, a link (valid 24 hours, once) where the user chooses their
        own password.

    CreatedUser:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        temporary_password:
          type: string
          description: With `credential` `password`. Shown once. The user must change it at first login.
        link:
          $ref: "#/components/schemas/PasswordLink"

    PasswordReset:
      type: object
      additionalProperties: false
      properties:
        credential:
          $ref: "#/components/schemas/Credential"

    NewCredential:
      type: object
      additionalProperties: false
      description: One of the two, as asked for. Shown once.
      properties:
        temporary_password:
          type: string
          description: The user must change it at their next login.
        link:
          $ref: "#/components/schemas/PasswordLink"

    PasswordLink:
      type: object
      additionalProperties: false
      description: |
        A setup or reset link. The app's link is `/set-password#<token>`; the
        token is in the fragment, so it isn't sent to servers or in Referer
        headers. Shown once.
      required: [token, expires_at]
      properties:
        token:
          $ref: "#/components/schemas/PasswordLinkToken"
        expires_at:
          type: string
          format: date-time

    PasswordLinkToken:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: 32 random bytes, base64url without padding.

    PasswordLinkCheck:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/PasswordLinkToken"

    PasswordLinkInfo:
      type: object
      additionalProperties: false
      required: [username, purpose, expires_at]
      properties:
        username:
          type: string
        purpose:
          type: string
          enum: [setup, reset]
          description: "`setup` for a new user, `reset` after an admin reset the password."
        expires_at:
          type: string
          format: date-time

    PasswordLinkUse:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          $ref: "#/components/schemas/PasswordLinkToken"
        new_password:
          type: string
          description: 12 to 72 bytes (UTF-8).
          minLength: 12
          maxLength: 72
          format: password

    User:
      type: object
      additionalProperties: false
      required: [id, username, admin, must_change_password, preferences]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        username:
          type: string
          example: admin
        admin:
          type: boolean
        must_change_password:
          type: boolean
          description: When true, the API refuses everything except changing the password (and `GET /me`, logout).
        preferences:
          $ref: "#/components/schemas/Preferences"

    Preferences:
      type: object
      additionalProperties: false
      description: Per-user settings. Missing or null fields use the default.
      properties:
        locale:
          type: string
          nullable: true
          description: BCP 47 language tag for number and date formats, e.g. `nb-NO`. Null means the browser's locale.
          pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
          maxLength: 35
          example: nb-NO
        language:
          type: string
          allOf:
            - $ref: "#/components/schemas/Language"
          nullable: true
          description: The web app's language. Null follows `locale` (`nb-NO` → `nb`, `nn-NO` → `nn`, others → `en`), or the browser's language when that's null too.
        default_refill_mode:
          type: string
          allOf:
            - $ref: "#/components/schemas/RefillMode"
          nullable: true
          description: The refill mode new buckets get when none is given. Null means `auto`.
        default_negative_tf:
          type: string
          allOf:
            - $ref: "#/components/schemas/NegativeTf"
          nullable: true
          description: The `negative_tf` new buckets get when none is given. Null means `debt`.
        income_refill_rules:
          type: array
          nullable: true
          maxItems: 20
          description: |
            An income from `counterparty` (the same text, ignoring case) of at
            least `min_amount` triggers the refill of its account's *on
            income* buckets, unless the income says otherwise with
            `triggers_refill` (spec §6). Null means no rules.
          items:
            $ref: "#/components/schemas/IncomeRefillRule"
        dashboard:
          type: object
          allOf:
            - $ref: "#/components/schemas/DashboardSettings"
          nullable: true
          description: The Dashboard's layout and widget settings. Replaced as a whole on update. Null means the default layout.
        time_zone:
          type: string
          nullable: true
          maxLength: 64
          description: |
            The user's IANA time zone, e.g. `Europe/Oslo` (400
            `invalid_request` for an unknown zone). The cycle rule plans
            cycles from local midnight in it. The web app sets it to the
            browser's zone when it's null.
          example: Europe/Oslo
        cycle_rule:
          type: object
          allOf:
            - $ref: "#/components/schemas/CycleRule"
          nullable: true
          description: |
            Plans cycles automatically (spec §3). Setting it needs a
            `time_zone` (400 `invalid_request`). Setting it or `time_zone`
            replans the cycles the rule planned that haven't been moved by
            hand or begun. Null means no rule; the planned cycles stay.
        whats_new_seen:
          type: string
          nullable: true
          description: |
            The last app version whose What's New the user was shown. The
            web app shows What's New when it opens a newer feature or major
            version.
          pattern: "^v\\d+\\.\\d{2}\\.\\d{2}$"
          example: v1.04.00
        whats_new_popup:
          type: boolean
          nullable: true
          description: Whether What's New pops up after an update. Null means true.
        saved_modules:
          type: array
          nullable: true
          maxItems: 100
          description: |
            The modules saved on Stats & reports (#201; saved graphs before,
            #122), in the order the user sees them. Each id is unique, each
            name is not blank, and none is a section (400 `invalid_request`
            otherwise). Replaced as a whole on update. Null means none.
          items:
            $ref: "#/components/schemas/SavedModule"
        report_templates:
          type: array
          nullable: true
          maxItems: 20
          description: |
            The report templates saved on Stats & reports (#125), in the
            order the user sees them. Template ids are unique, names are not
            blank and module ids are unique within a template (400
            `invalid_request` otherwise). Replaced as a whole on update.
            Null means none.
          items:
            $ref: "#/components/schemas/ReportTemplate"
        notifications:
          type: object
          allOf:
            - $ref: "#/components/schemas/NotificationSettings"
          nullable: true
          description: Which notifications show (#57). Null means all, bills 3 days ahead.

    DashboardSettings:
      type: object
      additionalProperties: false
      description: |
        The Dashboard's layouts. When `widgets` is set, it is the desktop
        layout, in order (an empty list is an empty Dashboard). When it's
        missing or null, the web app shows the default five widgets, using
        the per-type objects (from before #37) as their settings.

        `mobile_widgets` (#99) is the layout for narrow screens. When it's
        missing or null, the web app shows a copy of the desktop layout, or
        its mobile default when nothing else is saved.
      properties:
        widgets:
          type: array
          nullable: true
          maxItems: 30
          description: |
            The desktop layout's widgets, in order. Each widget's id is
            unique in its list, and it only carries the settings object for
            its own `type` (400 `invalid_request` otherwise).
          items:
            $ref: "#/components/schemas/DashboardWidget"
        mobile_widgets:
          type: array
          nullable: true
          maxItems: 30
          description: The mobile layout's widgets, in order, checked like `widgets`.
          items:
            $ref: "#/components/schemas/DashboardWidget"
        cycle:
          $ref: "#/components/schemas/CycleWidgetSettings"
        accounts:
          $ref: "#/components/schemas/AccountsWidgetSettings"
        bucket_status:
          $ref: "#/components/schemas/BucketStatusWidgetSettings"
        recent_transactions:
          $ref: "#/components/schemas/RecentWidgetSettings"

    DashboardWidget:
      type: object
      additionalProperties: false
      required: [id, type, width]
      description: One widget on the Dashboard. A missing settings object means its defaults.
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,40}$"
          description: Made by the web app; unique in the layout.
        type:
          type: string
          enum: [cycle, health, bucket_status, accounts, recent_transactions, in_out, module, scheduled]
        width:
          type: string
          enum: [half, full]
          description: Half or the full width of the Dashboard on wide screens.
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
          description: |
            A custom title (not blank). Null or missing means the automatic
            one: the bucket's or account's name for One bucket and One
            account, otherwise the widget's name.
        cycle:
          $ref: "#/components/schemas/CycleWidgetSettings"
        accounts:
          $ref: "#/components/schemas/AccountsWidgetSettings"
        bucket_status:
          $ref: "#/components/schemas/BucketStatusWidgetSettings"
        recent_transactions:
          $ref: "#/components/schemas/RecentWidgetSettings"
        in_out:
          $ref: "#/components/schemas/InOutWidgetSettings"
        module:
          $ref: "#/components/schemas/ModuleWidgetSettings"
        scheduled:
          $ref: "#/components/schemas/ScheduledWidgetSettings"

    CycleWidgetSettings:
      type: object
      additionalProperties: false
      required: [show_next]
      properties:
        show_next:
          type: boolean
          description: Also show the next planned cycle. True by default.

    AccountsWidgetSettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all, account]
          description: All accounts (the default), or only the one in `account_id`.
        account_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: The account shown in `account` mode.

    BucketStatusWidgetSettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [attention, all, most_used, account, bucket]
          description: |
            Which buckets the widget shows: the ones that need attention
            (the default), all of them, the most used ones, those of the
            account in `account_id` (#89), or the one in `bucket_id`.
        account_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: The account whose buckets `account` mode shows.
        bucket_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/BucketId"
          nullable: true
          description: The bucket shown in `bucket` mode.
        show_mode:
          type: boolean
          description: Show the mode above the buckets (e.g. *Needs attention*). True by default.

    ModuleWidgetSettings:
      type: object
      additionalProperties: false
      required: [saved_module_id]
      description: |
        A module widget (#201; a graph widget before, #124) shows one of
        the user's saved modules (`saved_modules`), so it follows changes
        to it. An id that isn't among them means the saved module was
        deleted; the widget says so.
      properties:
        saved_module_id:
          type: string
          minLength: 1
          maxLength: 40
        view:
          $ref: "#/components/schemas/ModuleWidgetView"
        show_period:
          type: boolean
          description: |
            A line under the title with the module's period and its dates
            (#203). Missing means true.
        graph_height:
          type: string
          enum: [small, medium, large]
          description: |
            A compact graph's height (#203): small, medium (missing; about
            200 px on half width, 260 on full) or large.
        transactions:
          $ref: "#/components/schemas/ModuleWidgetTransactions"
        flows:
          $ref: "#/components/schemas/ModuleWidgetFlows"
        budget:
          $ref: "#/components/schemas/ModuleWidgetBudget"

    ModuleWidgetTransactions:
      type: object
      additionalProperties: false
      description: |
        A compact transactions module's options (#203); each left out is
        its default. They only apply while the saved module is one.
      properties:
        rows:
          type: integer
          enum: [0, 3, 5, 10, 15, 20]
          description: How many of the newest it lists; 0 for none. 3 by default.
        summary:
          type: string
          enum: [net, in_out, "off"]
          description: |
            The line above them: the count and net per currency (`net`, the
            default), the count with in, out and net (`in_out`), or none.

    ModuleWidgetFlows:
      type: object
      additionalProperties: false
      description: |
        A compact In/out/balance module's options (#203); each left out is
        its default.
      properties:
        figures:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [in, out, net]
          description: The accounts' figures it shows, in this order. All three by default.
        top:
          type: integer
          enum: [0, 3, 5, 10]
          description: How many of those that spent the most it lists; 0 for none. 3 by default.
        top_of:
          type: string
          enum: [buckets, accounts]
          description: |
            Whether those are buckets or accounts. Missing follows the
            module: accounts when it shows accounts only, else buckets.

    ModuleWidgetBudget:
      type: object
      additionalProperties: false
      description: |
        A compact budget vs spending module's options (#203); each left
        out is its default.
      properties:
        rows:
          type: integer
          enum: [0, 3, 6, 10]
          description: How many buckets it lists before "+N more"; 0 for all. 6 by default.
        order:
          type: string
          enum: [share, used, name]
          description: |
            The share of the budget used, highest first (the default), the
            amount used, most first, or the name.
        attention:
          type: boolean
          description: |
            Only buckets more than 90 % used or over budget, as Bucket
            status's Needs attention. Missing means false.
        total:
          type: boolean
          description: |
            A first line with the total used of the total budget, per
            currency. Missing means false.

    ModuleWidgetView:
      type: string
      enum: [compact, full]
      description: |
        How a module widget shows its module (#203): `compact` (left out,
        the default) in a short form for the Dashboard, or `full` as on
        Stats & reports.

    InOutWidgetSettings:
      type: object
      additionalProperties: false
      required: [figures, period]
      description: |
        The In/out widget (#90): income, expenses and their balance over a
        period, on one account or on all accounts in the app's currency.
      properties:
        figures:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: The figures to show, in this order.
          items:
            type: string
            enum: [income, expenses, balance]
        period:
          type: string
          enum: [days, today, week, cycle, month, year]
          description: |
            The last `days` days (today included), today, this week, the
            active cycle, this month or this year, in the user's time zone.
        days:
          type: integer
          minimum: 1
          maximum: 366
          description: The number of days in `days` mode. 30 by default.
        account_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: |
            One account, whose transfers count as income and expenses. Null
            or missing means all accounts, without transfers.

    ScheduledWidgetSettings:
      type: object
      additionalProperties: false
      required: [show, count]
      properties:
        show:
          type: string
          enum: [both, queue, upcoming]
          description: The approval queue, what's coming up, or both (the default).
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: How many of each it shows. 5 by default.

    RecentWidgetSettings:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: How many transactions it shows. 5 by default.
        show_reversed:
          type: boolean
          description: |
            Also list reversed transactions and moved originals (#91).
            Missing means false.

    Language:
      type: string
      description: "A web app language: English, Norwegian bokmål or Norwegian nynorsk."
      enum: [en, nb, nn]

    CycleRule:
      type: object
      additionalProperties: false
      required: [day, shift, holidays, ahead]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: The day of the month a cycle starts. A day the month doesn't have is its last day.
        shift:
          type: string
          enum: [previous, next, none]
          description: Where the day moves when it's a weekend or a holiday.
        holidays:
          type: string
          enum: [none, "NO"]
          description: The holidays besides weekends. `NO` is Norwegian bank holidays, including 24 and 31 December.
        ahead:
          type: integer
          minimum: 1
          maximum: 12
          description: How many planned cycles to keep.

    CyclePeriodsRequest:
      type: object
      additionalProperties: false
      required: [rule]
      properties:
        rule:
          $ref: "#/components/schemas/CycleRule"
        from:
          type: string
          format: date
          description: The first period is the one containing this date. Defaults to today in the user's time zone.
        count:
          type: integer
          minimum: 1
          maximum: 12
          default: 4

    CyclePeriod:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: The period's last day.

    IncomeRefillRule:
      type: object
      additionalProperties: false
      required: [counterparty, min_amount]
      properties:
        counterparty:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        min_amount:
          type: string
          description: The smallest income that matches, at least 0.
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          example: "20000"

    AccountId:
      type: string
      description: 4-digit bank account ID.
      pattern: "^[1-9][0-9]{3}$"
      example: "4821"

    Amount:
      type: string
      description: An amount with at most 2 decimals, as a string.
      pattern: "^-?[0-9]{1,12}(\\.[0-9]{1,2})?$"
      example: "1234.50"

    Currency:
      type: string
      description: |
        ISO 4217 currency code. Only real currencies with at most 2 decimals
        are accepted (not e.g. XAU or KWD); others get 400 `invalid_request`.
      pattern: "^[A-Z]{3}$"
      example: NOK

    AccountBank:
      type: string
      maxLength: 100
      description: The bank the account is in (#70), trimmed; "" when not given, and "" clears it. Register interest uses it as the counterparty.
      example: DNB

    AccountName:
      type: string
      description: 1 to 100 characters after trimming. Unique among the user's accounts, ignoring case.
      minLength: 1
      maxLength: 100
      example: Main account

    AccountType:
      type: string
      enum: [usage, savings, bsu, fund, investment]

    Account:
      type: object
      additionalProperties: false
      required: [id, name, type, currency, balance, unallocated, expected_income, bank, created_at]
      properties:
        id:
          $ref: "#/components/schemas/AccountId"
        name:
          type: string
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          $ref: "#/components/schemas/Currency"
        bank:
          $ref: "#/components/schemas/AccountBank"
        balance:
          $ref: "#/components/schemas/Amount"
        unallocated:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The part of the balance that backs no bucket, balance − Σ CAF of its buckets (spec §7). Negative when the account is overdrawn.
        expected_income:
          type: string
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: The income expected on the account per cycle, which Budget setup compares the buckets' refill amounts with (spec §9). Null until entered.
        created_at:
          type: string
          format: date-time

    CounterpartyRename:
      type: object
      additionalProperties: false
      required: [account_id, from, to]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountId"
        type:
          $ref: "#/components/schemas/TransactionType"
        tag:
          type: string
          maxLength: 50
          description: Only transactions with this tag, ignoring case.
        from:
          type: array
          minItems: 1
          maxItems: 10
          description: The counterparties to rename, trimmed and ignoring case.
          items:
            type: string
            maxLength: 200
        to:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        apply:
          type: boolean
          default: false
          description: Make the corrections; without it, only count them.

    AccountCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/AccountName"
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          $ref: "#/components/schemas/Currency"
        bank:
          $ref: "#/components/schemas/AccountBank"
        opening_balance:
          $ref: "#/components/schemas/Amount"
        opening_at:
          type: string
          format: date-time
          description: When the opening balance applies. Defaults to now.

    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/AccountName"
        type:
          $ref: "#/components/schemas/AccountType"
        expected_income:
          type: string
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: The income expected per cycle, at least 0. Null clears it.
        bank:
          $ref: "#/components/schemas/AccountBank"

    BalanceAdjustment:
      type: object
      additionalProperties: false
      required: [target_balance]
      properties:
        target_balance:
          $ref: "#/components/schemas/Amount"
        at:
          type: string
          format: date-time
          description: The moment the balance is correct for. Defaults to now.

    AccountDelete:
      type: object
      additionalProperties: false
      properties:
        remaining_funds:
          type: object
          additionalProperties: false
          required: [action]
          description: What happens to money left in the account. Only needed when the balance isn't 0.
          properties:
            action:
              type: string
              enum: [transfer, adjust]
              description: "`transfer` moves it to `to_account_id` (TRF); `adjust` records a balance adjustment to 0 (BLA)."
            to_account_id:
              $ref: "#/components/schemas/AccountId"
        bucket_sources:
          type: object
          description: A new source account for every bucket funded from this account, as bucket ID (10 digits) → account ID.
          additionalProperties:
            $ref: "#/components/schemas/AccountId"
          example:
            "4829131234": "5120"
        delete_buckets:
          type: array
          description: Buckets funded from this account to delete with it. What's left in each is released to the account first.
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/BucketId"

    CycleId:
      type: string
      description: 12-digit cycle ID (the owner's user ID, then 6 digits).
      pattern: "^[1-9][0-9]{11}$"
      example: "482913000417"

    CycleState:
      type: string
      enum: [future, active, finished]

    Cycle:
      type: object
      additionalProperties: false
      required: [id, start_at, end_at, state, generated, created_at]
      properties:
        id:
          $ref: "#/components/schemas/CycleId"
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: Exclusive. For the active cycle this is the planned end; once it has passed, bucket transactions are refused until the cycle is extended or ended.
        state:
          $ref: "#/components/schemas/CycleState"
        generated:
          type: boolean
          description: The cycle rule planned it, and it hasn't been moved by hand since.
        created_at:
          type: string
          format: date-time

    CycleTimes:
      type: object
      additionalProperties: false
      required: [start_at, end_at]
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time

    CycleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time

    CycleEnd:
      type: object
      additionalProperties: false
      properties:
        start_next:
          type: boolean
          default: false
          description: When the next planned cycle begins later than this one ends, start it right away instead of leaving a gap.

    CycleEndResult:
      type: object
      additionalProperties: false
      required: [ended, started]
      properties:
        ended:
          $ref: "#/components/schemas/Cycle"
        started:
          type: object
          allOf:
            - $ref: "#/components/schemas/Cycle"
          nullable: true
          description: The cycle that started, or null if none did.

    CurrentCycles:
      type: object
      additionalProperties: false
      required: [active, next]
      properties:
        active:
          type: object
          allOf:
            - $ref: "#/components/schemas/Cycle"
          nullable: true
        next:
          type: object
          allOf:
            - $ref: "#/components/schemas/Cycle"
          nullable: true
          description: The earliest planned cycle.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        new_password:
          type: string
          description: 12 to 72 bytes (UTF-8), different from the current password.
          minLength: 12
          maxLength: 72
          format: password

    BucketId:
      type: string
      description: 10-digit bucket ID.
      pattern: "^[1-9][0-9]{9}$"
      example: "4829131234"

    BucketName:
      type: string
      description: 1 to 100 characters after trimming. Unique among the user's buckets, ignoring case.
      minLength: 1
      maxLength: 100
      example: Groceries

    CapMode:
      type: string
      enum: [multiplier, fixed, none]
      description: |
        How the Bucket Capacity (BC) is set: the refill amount times
        `cap_multiplier`, or the fixed `cap_amount`. `none` (no capacity) is
        for `fully_manual` buckets only, which can't use `multiplier`.

    CapMultiplier:
      type: string
      description: 1.00 or more, with at most 2 decimals, as a string.
      pattern: "^[0-9]{1,4}(\\.[0-9]{1,2})?$"
      example: "1.50"

    RefillMode:
      type: string
      enum: [auto, manual, on_income, fully_manual]
      description: |
        `auto` refills at cycle start, `manual` with a button once per cycle,
        `on_income` when income arrives. A `fully_manual` bucket (#76) is
        never refilled: its refill amount is 0, it always keeps its funds,
        and they only change through adjustments.

    NegativeTf:
      type: string
      enum: [debt, clear]
      description: |
        What a refill does with a negative TF (an overspent bucket, spec §6).
        Only used with `keep_funds`; without it the refill always sets TF to
        RA. `debt` adds RA as usual, so the overspend is paid back from the
        refill; `clear` brings TF to 0 first, so TF becomes RA.

    OverflowDestination:
      type: string
      enum: [unallocated, savings_distribution, savings_target]
      description: Where overflow goes. Only `unallocated` is available until the savings module; the others get 400.

    Bucket:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - source_account_id
        - currency
        - refill_amount
        - cap_mode
        - cap_multiplier
        - cap_amount
        - capacity
        - target_funds
        - current_available_funds
        - keep_funds
        - negative_tf
        - refill_mode
        - overflow_destination
        - priority
        - importance
        - refilled
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/BucketId"
        name:
          type: string
        source_account_id:
          $ref: "#/components/schemas/AccountId"
        currency:
          $ref: "#/components/schemas/Currency"
        refill_amount:
          $ref: "#/components/schemas/Amount"
        cap_mode:
          $ref: "#/components/schemas/CapMode"
        cap_multiplier:
          type: string
          allOf:
            - $ref: "#/components/schemas/CapMultiplier"
          nullable: true
          description: Set in the multiplier mode, otherwise null.
        cap_amount:
          type: string
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: Set in the fixed mode, otherwise null.
        capacity:
          type: string
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: The Bucket Capacity (BC), never below the refill amount. Null with the `none` capacity mode.
        target_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Target Funds (TF), the sum of the bucket's transactions.
        current_available_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: |
            Current Available Funds (CAF), what the source account actually
            backs. Set by the Money Allocation Routine (spec §7): below TF when
            the account can't cover all its buckets.
        keep_funds:
          type: boolean
        negative_tf:
          $ref: "#/components/schemas/NegativeTf"
        refill_mode:
          $ref: "#/components/schemas/RefillMode"
        overflow_destination:
          $ref: "#/components/schemas/OverflowDestination"
        priority:
          type: boolean
        importance:
          type: integer
          minimum: 1
          maximum: 10
        refilled:
          type: boolean
          description: |
            The bucket has been refilled in the active cycle (spec §6). A
            bucket is refilled at most once per cycle.
        created_at:
          type: string
          format: date-time

    AccountFlow:
      type: object
      additionalProperties: false
      description: An account's money in and out over a period. All amounts are positive or 0.
      required: [account_id, income, expenses, transfers_in, transfers_out]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountId"
        income:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Income (INC).
        expenses:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Expenses (EXP), as a positive amount.
        transfers_in:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Transfers into the account (TRF).
        transfers_out:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Transfers out of the account (TRF), as a positive amount.

    SavedModule:
      type: object
      additionalProperties: false
      required: [id, name, period, module]
      description: |
        A module saved on Stats & reports (#201): a graph, transactions,
        in/out/balance or budget vs spending module (not a section) with a
        period of its own, which Stats and the Dashboard show it over. Its
        filters are its own. Added to a report, it's copied, and the
        report's period applies there.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 60
        period:
          type: string
          maxLength: 40
          description: |
            As a graph's (GraphSettings): the last N days, weeks, cycles,
            months, quarters, half-years or years too, which reports don't
            have.
          pattern: "^(last-[0-9]{1,3}-(days|weeks|cycles|months|quarters|half_years|years)|(current|previous)-(day|week|cycle|month|quarter|half_year|year)|(day|week)-[0-9]{4}-[0-9]{2}-[0-9]{2}|month-[0-9]{4}-[0-9]{2}|quarter-[0-9]{4}-q[1-4]|half_year-[0-9]{4}-h[12]|year-[0-9]{4}|cycle-[1-9][0-9]{11}|custom-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9]{2}-[0-9]{2})$"
          example: last-3-months
        compare_to:
          type: string
          enum: [previous, last_year]
          description: What a compared graph module compares with, as a report's. Previous by default.
        module:
          $ref: "#/components/schemas/ReportModule"

    GraphSettings:
      type: object
      additionalProperties: false
      required: [kind, metric, period, resolution]
      description: |
        A line, bar or pie graph on Stats & reports (#122, #123): what it
        sums over which period, and how it's drawn. The fields after
        `resolution` match the Stats API's parameters and are left out when
        not used.
      properties:
        kind:
          $ref: "#/components/schemas/GraphKind"
        metric:
          $ref: "#/components/schemas/GraphMetric"
        period:
          type: string
          maxLength: 40
          description: |
            The period, relative to when the graph is shown:
            `last-<n>-days|weeks|cycles|months|quarters|half_years|years`,
            `current-<unit>` or `previous-<unit>` (unit `day`, `week`,
            `cycle`, `month`, `quarter`, `half_year` or `year`), one specific period (`day-<date>`, `week-<first
            day>`, `month-<yyyy-mm>`, `quarter-<yyyy>-q<1-4>`,
            `half_year-<yyyy>-h<1-2>`, `year-<yyyy>` or `cycle-<cycle ID>`),
            or `custom-<first day>-<last day>`.
          pattern: "^(last-[0-9]{1,3}-(days|weeks|cycles|months|quarters|half_years|years)|(current|previous)-(day|week|cycle|month|quarter|half_year|year)|(day|week)-[0-9]{4}-[0-9]{2}-[0-9]{2}|month-[0-9]{4}-[0-9]{2}|quarter-[0-9]{4}-q[1-4]|half_year-[0-9]{4}-h[12]|year-[0-9]{4}|cycle-[1-9][0-9]{11}|custom-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9]{2}-[0-9]{2})$"
          example: last-30-days
        resolution:
          $ref: "#/components/schemas/GraphResolution"
        group_by:
          $ref: "#/components/schemas/GraphGroupBy"
        account_ids:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AccountId"
        bucket_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BucketId"
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        counterparty:
          type: string
          maxLength: 200
          description: Only transactions whose counterparty or description contains this text, ignoring case.
        cumulative:
          type: boolean
          description: Lines only. Running totals from the start of the period.
        side_by_side:
          type: boolean
          description: Bars only. Series side by side instead of stacked.
        stepped:
          type: boolean
          description: Lines only. Each interval's value is held until the next, instead of a straight line between points.
        fit_y_axis:
          type: boolean
          description: Fit the Y axis to the values instead of including 0 (the default).
        pie_labels:
          allOf:
            - $ref: "#/components/schemas/PieLabels"
          description: Pies only. A list of the slices beside the pie (`list`, the default), labels on the slices, or both.
        top:
          type: integer
          minimum: 1
          maximum: 8
          description: How many series get their own colour (at most 8, the graph palette); the rest add up to Other. 5 by default.
        show_as:
          allOf:
            - $ref: "#/components/schemas/GraphShowAs"
          description: |
            Spending and income only, not per hour (#182): each interval's sum
            as an amount per day, week, month (365.25 / 12 days) or cycle (the
            average length of the user's cycles in the period), divided by the
            days it covers so far. Left out for `total`, the default.
        average:
          type: boolean
          description: |
            Lines and bars only, not running totals (#182): a dashed line at
            the average of the intervals shown.

    GraphKind:
      type: string
      enum: [line, bar, pie]
      description: |
        A pie grouped by `account` or `bucket` has a slice per series over
        the whole period (`resolution` is kept for when the kind changes).
        Ungrouped, it has a slice per interval of `resolution`, at most 12.
        A balance pie is always per account.

    GraphMetric:
      type: string
      enum: [spending, income, balance]

    GraphResolution:
      type: string
      enum: [hour, day, week, month, year, cycle, total]

    GraphGroupBy:
      type: string
      enum: [none, account, bucket, counterparty]

    PieLabels:
      type: string
      enum: [list, slices, both]

    GraphShowAs:
      type: string
      enum: [total, day, week, month, cycle]

    ReportTemplate:
      type: object
      additionalProperties: false
      required: [id, name, report]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 60
        report:
          $ref: "#/components/schemas/ReportSettings"

    ReportSettings:
      type: object
      additionalProperties: false
      required: [period, modules]
      description: |
        A report on Stats & reports (#125): a period, filters for the whole
        report, and its modules in order.
      properties:
        period:
          type: string
          maxLength: 40
          description: |
            As in `GraphSettings`, but only years, half-years, quarters,
            months and cycles: `current-<unit>` or `previous-<unit>`, one
            specific period, or `custom-<first day>-<last day>`.
          pattern: "^((current|previous)-(cycle|month|quarter|half_year|year)|month-[0-9]{4}-[0-9]{2}|quarter-[0-9]{4}-q[1-4]|half_year-[0-9]{4}-h[12]|year-[0-9]{4}|cycle-[1-9][0-9]{11}|custom-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9]{2}-[0-9]{2})$"
          example: previous-year
        compare_to:
          type: string
          enum: [previous, last_year]
          description: |
            What a module compares with: the period right before (the
            default), or the same period a year earlier. A cycle always
            compares with the cycle before; a custom period doesn't compare.
        account_ids:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AccountId"
        bucket_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BucketId"
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        counterparty:
          type: string
          maxLength: 200
        modules:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ReportModule"

    ReportModule:
      type: object
      additionalProperties: false
      description: |
        A module of a report. Its `type` says which settings it has: a
        `graph` module has `graph`, a `transactions` module (#126) has
        `transactions`, a `flows` module (#126) has `flows`, a `budget` module
        (#126) has `budget`, a `section` module (#194) has `section`, and none
        of the others (400 `invalid_request`). Module ids are unique across
        the report, those in sections included.
      required: [id, type]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
        type:
          type: string
          enum: [graph, transactions, flows, budget, section]
          description: What the module shows.
        title:
          type: string
          maxLength: 80
        graph:
          $ref: "#/components/schemas/ReportGraph"
        transactions:
          $ref: "#/components/schemas/ReportTransactions"
        flows:
          $ref: "#/components/schemas/ReportFlows"
        budget:
          $ref: "#/components/schemas/ReportBudget"
        section:
          $ref: "#/components/schemas/ReportSection"
        compare:
          type: string
          enum: ["off", both, difference]
          description: |
            Graphs only. Lines and bars: the previous period beside this one
            (`both`) or this period minus the previous (`difference`). Pies:
            `both` and `difference` show the previous period's pie too.
            `off` by default.
        breakdown:
          type: string
          enum: [none, month, cycle]
          description: |
            Graphs only. Also one small graph per month or per cycle, for
            periods of at least 60 days. Months and cycles cut by the
            period's edges are clipped. `none` by default.

    ReportSection:
      type: object
      additionalProperties: false
      required: [unit, modules]
      description: |
        A report section (#194): its modules, repeated for each month or
        cycle of the report's period (at most 24), each over that part and
        compared with the one before (or a year earlier) as the report
        says. They use the report's filters unless they set their own. A
        section can't hold a section (400 `invalid_request`).
      properties:
        unit:
          type: string
          enum: [month, cycle]
        modules:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/ReportModule"

    ReportFlows:
      type: object
      additionalProperties: false
      description: |
        An In/out/balance module (#126): each bucket's money in and out with
        its TF at the start and end, and each account's income and
        expenses. Only the account and bucket filters apply; set here, they
        replace the report's.
      properties:
        account_ids:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AccountId"
        bucket_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BucketId"
        show:
          type: string
          enum: [buckets, accounts, both]
          description: The buckets' table (the default), the accounts', or both.
        transfers:
          type: boolean
          description: Count the accounts' transfers as money in and out.
        view:
          type: string
          enum: [table, grid]
          description: Tables (the default), or a grid with a card per bucket and account (#187).
        balances:
          type: boolean
          description: Give the accounts their start and end balance, with what else moved them (#187).
        details:
          type: boolean
          description: Split in and out into their parts.
        breakdown:
          type: string
          enum: [none, month, cycle]
          description: Also a table or grid per month or cycle, for periods of at least 60 days. `none` by default.

    ReportPdfRequest:
      type: object
      additionalProperties: false
      description: |
        What to render (#127): the report as the screen has it, its name,
        and the asking browser's language, locale and time zone.
      required: [name, report, language, locale, time_zone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: The report's name, for the cover and the file name.
        report:
          $ref: "#/components/schemas/ReportSettings"
        language:
          type: string
          enum: [en, nb, nn]
        locale:
          type: string
          minLength: 2
          maxLength: 35
          pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$"
          description: |
            A BCP 47 tag, e.g. `nb-NO`, for numbers and dates: the locale
            the app formats with (#192), the user's preference, else the
            browser's own formatting default.
        time_zone:
          type: string
          minLength: 1
          maxLength: 64
          description: An IANA time zone, e.g. `Europe/Oslo`.
          example: Europe/Oslo

    ReportBudget:
      type: object
      additionalProperties: false
      description: |
        A budget vs spending module (#126): each bucket's budget, used,
        overflow and left per cycle, from the cycle's bucket figures, with a
        summary over the cycles. A cycle counts in the period that holds
        most of its days. Only the account and bucket filters apply; set
        here, they replace the report's. An account filter matches a
        bucket's source account.
      properties:
        account_ids:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AccountId"
        bucket_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BucketId"
        per_cycle:
          type: boolean
          description: A table per cycle after the summary (the default), or only the summary (false).

    ReportTransactions:
      type: object
      additionalProperties: false
      description: |
        A transactions module (#126): the report's period's transactions, as
        the Transactions list shows them. A filter set here replaces the
        report's for that field.
      properties:
        account_ids:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AccountId"
        bucket_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BucketId"
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        counterparty:
          type: string
          maxLength: 200
        types:
          type: array
          description: Only these types; empty or left out, all but refills and adjustments.
          maxItems: 10
          items:
            $ref: "#/components/schemas/TransactionType"
        system:
          type: boolean
          description: Also refills and adjustments (REF, OVF, OPF, BUA, BAT).
        reversed:
          type: boolean
          description: Also reversed transactions and moved originals (#91).
        group_by:
          type: string
          enum: [day, week, month, cycle]
          description: Under a heading per day (the default), week, month or cycle.
        order:
          type: string
          enum: [newest, oldest]
          description: Newest first (the default) or oldest first.
        view:
          type: string
          enum: [list, table]
          description: |
            As the Transactions list shows them (the default), or as a table
            with `columns` (#185), with a subtotal per group and a total.
        columns:
          type: array
          description: |
            The table's columns, in order (#185). Left out, date,
            counterparty, account, buckets, tags and amount. `balance` (the
            balance after, #106) shows only with exactly one account.
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TransactionColumn"
        rows:
          type: string
          enum: [transaction, bucket_line]
          description: |
            A table row per transaction, its buckets in one cell (the
            default), or per bucket line, with that line's amount (#185).
        sections:
          type: string
          enum: ["off", month, cycle]
          description: |
            Off (the default), or each month or cycle of the period under its
            own heading (#191), with a count and in, out and net, empty ones
            included and each on a new page in a PDF. `group_by` applies
            inside each section.

    TransactionColumn:
      type: string
      enum: [date, time, type, account, counterparty, description, tags, buckets, amount, balance, notes]
      description: |
        A column of a transactions table (#185). `notes` are the edited,
        reversed, moved and scheduled marks.

    ReportGraph:
      type: object
      additionalProperties: false
      required: [kind, metric, resolution]
      description: |
        A report module's graph: `GraphSettings` without the period, which
        is the report's. A filter set here replaces the report's for that
        field.
      properties:
        kind:
          $ref: "#/components/schemas/GraphKind"
        metric:
          $ref: "#/components/schemas/GraphMetric"
        resolution:
          $ref: "#/components/schemas/GraphResolution"
        group_by:
          $ref: "#/components/schemas/GraphGroupBy"
        account_ids:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AccountId"
        bucket_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BucketId"
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        counterparty:
          type: string
          maxLength: 200
          description: Only transactions whose counterparty or description contains this text, ignoring case.
        cumulative:
          type: boolean
          description: Lines only. Running totals from the start of the period.
        side_by_side:
          type: boolean
          description: Bars only. Series side by side instead of stacked.
        stepped:
          type: boolean
          description: Lines only. Each interval's value is held until the next, instead of a straight line between points.
        fit_y_axis:
          type: boolean
          description: Fit the Y axis to the values instead of including 0 (the default).
        pie_labels:
          allOf:
            - $ref: "#/components/schemas/PieLabels"
          description: Pies only. A list of the slices beside the pie (`list`, the default), labels on the slices, or both.
        top:
          type: integer
          minimum: 1
          maximum: 8
          description: How many series get their own colour (at most 8, the graph palette); the rest add up to Other. 5 by default.
        show_as:
          allOf:
            - $ref: "#/components/schemas/GraphShowAs"
          description: |
            Spending and income only, not per hour (#182): each interval's sum
            as an amount per day, week, month (365.25 / 12 days) or cycle (the
            average length of the user's cycles in the period), divided by the
            days it covers so far. Left out for `total`, the default.
        average:
          type: boolean
          description: |
            Lines and bars only, not running totals (#182): a dashed line at
            the average of the intervals shown.


    StatsSeries:
      type: object
      additionalProperties: false
      description: A period cut into intervals, and one value per interval in each series.
      required: [intervals, series]
      properties:
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/StatsInterval"
        series:
          type: array
          description: Sorted by currency, then account or bucket ID (the series without a bucket last).
          items:
            $ref: "#/components/schemas/StatsSeriesLine"

    StatsFlows:
      type: object
      additionalProperties: false
      required: [intervals, buckets, accounts]
      properties:
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/StatsInterval"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BucketFlow"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountFlowSeries"

    BucketFlow:
      type: object
      additionalProperties: false
      required: [bucket_id, account_id, currency, values]
      properties:
        bucket_id:
          $ref: "#/components/schemas/BucketId"
        opened_at:
          type: string
          format: date-time
          description: When its opening funds are dated, if that's in one of the intervals, which then starts with them (#187).
        account_id:
          description: The bucket's source account.
          allOf:
            - $ref: "#/components/schemas/AccountId"
        currency:
          $ref: "#/components/schemas/Currency"
        values:
          type: array
          description: One per interval, in the same order.
          items:
            $ref: "#/components/schemas/BucketFlowValues"

    BucketFlowValues:
      type: object
      additionalProperties: false
      required: [start, refills, income, opening_funds, adjustments_in, adjustments_out, transfers_in, transfers_out, spent, overflow, in, out, end]
      properties:
        start:
          description: TF when the interval begins.
          allOf:
            - $ref: "#/components/schemas/Amount"
        refills:
          $ref: "#/components/schemas/Amount"
        income:
          $ref: "#/components/schemas/Amount"
        opening_funds:
          $ref: "#/components/schemas/Amount"
        adjustments_in:
          $ref: "#/components/schemas/Amount"
        adjustments_out:
          $ref: "#/components/schemas/Amount"
        transfers_in:
          $ref: "#/components/schemas/Amount"
        transfers_out:
          $ref: "#/components/schemas/Amount"
        spent:
          $ref: "#/components/schemas/Amount"
        overflow:
          $ref: "#/components/schemas/Amount"
        in:
          description: refills + income + opening funds + adjustments in + transfers in.
          allOf:
            - $ref: "#/components/schemas/Amount"
        out:
          description: spent + overflow + adjustments out + transfers out.
          allOf:
            - $ref: "#/components/schemas/Amount"
        end:
          description: TF when the interval ends.
          allOf:
            - $ref: "#/components/schemas/Amount"

    AccountFlowSeries:
      type: object
      additionalProperties: false
      required: [account_id, currency, values]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountId"
        opened_at:
          type: string
          format: date-time
          description: When its opening balance is dated, if that's in one of the intervals, which then starts with it (#187).
        currency:
          $ref: "#/components/schemas/Currency"
        values:
          type: array
          description: One per interval, in the same order.
          items:
            $ref: "#/components/schemas/AccountFlowValues"

    AccountFlowValues:
      type: object
      additionalProperties: false
      required: [start, income, expenses, transfers_in, transfers_out, end]
      properties:
        start:
          description: The balance when the interval begins.
          allOf:
            - $ref: "#/components/schemas/Amount"
        income:
          $ref: "#/components/schemas/Amount"
        expenses:
          $ref: "#/components/schemas/Amount"
        transfers_in:
          $ref: "#/components/schemas/Amount"
        transfers_out:
          $ref: "#/components/schemas/Amount"
        end:
          description: The balance when the interval ends.
          allOf:
            - $ref: "#/components/schemas/Amount"

    StatsInterval:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Exclusive.

    StatsSeriesLine:
      type: object
      additionalProperties: false
      required: [currency, values]
      properties:
        account_id:
          description: The account, when grouped by account.
          allOf:
            - $ref: "#/components/schemas/AccountId"
        bucket_id:
          type: string
          nullable: true
          description: The bucket, when grouped by bucket; null for the part on no bucket.
          allOf:
            - $ref: "#/components/schemas/BucketId"
        counterparty:
          type: string
          nullable: true
          description: When grouped by counterparty, its name as the series' newest transaction spells it; null for the part with no counterparty.
        transfers:
          type: boolean
          description: When grouped by counterparty, true for the series of transfers (counted with `transfers`).
        currency:
          $ref: "#/components/schemas/Currency"
        values:
          type: array
          description: One value per interval, in the same order.
          items:
            $ref: "#/components/schemas/Amount"

    BucketFigures:
      type: object
      additionalProperties: false
      description: |
        A bucket's figures for one cycle. The parts are signed: a reduction
        or a transfer out is negative. `budget` = `start` + `refills` +
        `income` + `opening_funds` + `adjustments` + `transfers`, and `left` =
        `budget` − `used` − `overflow`, which is the current TF while the cycle
        is active.
      required: [bucket_id, start, refills, income, opening_funds, adjustments, transfers, budget, used, overflow, capped, swept, left]
      properties:
        bucket_id:
          $ref: "#/components/schemas/BucketId"
        start:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: TF when the cycle began, from the lines of earlier cycles.
        refills:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Refills (REF).
        income:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Income put into the bucket (INC).
        opening_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Opening funds (OPF).
        adjustments:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Bucket adjustments (BUA).
        transfers:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Transfers to (positive) or from (negative) other buckets (BAT).
        budget:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What the bucket had to spend in the cycle.
        used:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What was spent (EXP, net of corrections), as a positive amount.
        overflow:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What overflowed (OVF), as a positive amount; `capped` + `swept`.
        capped:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: |
            What a refill's overflow removed because TF went above BC (Keep
            funds), as a positive amount: never spendable in the cycle.
        swept:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: |
            What the cycle's end removed (without Keep funds), as a positive
            amount: what was left unspent.
        left:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What's left at the end of the cycle.

    BucketCreate:
      type: object
      additionalProperties: false
      required: [name, source_account_id]
      properties:
        name:
          $ref: "#/components/schemas/BucketName"
        source_account_id:
          $ref: "#/components/schemas/AccountId"
        refill_amount:
          $ref: "#/components/schemas/Amount"
        cap_mode:
          $ref: "#/components/schemas/CapMode"
        cap_multiplier:
          $ref: "#/components/schemas/CapMultiplier"
        cap_amount:
          $ref: "#/components/schemas/Amount"
        keep_funds:
          type: boolean
        negative_tf:
          allOf:
            - $ref: "#/components/schemas/NegativeTf"
          description: Defaults to the user's `default_negative_tf` preference, or `debt`.
        refill_mode:
          allOf:
            - $ref: "#/components/schemas/RefillMode"
          description: Defaults to the user's `default_refill_mode` preference, or `auto`.
        overflow_destination:
          $ref: "#/components/schemas/OverflowDestination"
        priority:
          type: boolean
        importance:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        opening_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: >
            Recorded now as an Opening Funds (OPF) transaction when not 0.
            Needs an active cycle, and counts as the bucket's refill in it
            (spec §6), so no refill later in the cycle changes the amount.
        refill:
          type: boolean
          description: >
            Refill the bucket now in the active cycle (spec §6), whatever
            its refill mode except `fully_manual`, which is never refilled.
            It counts as the bucket's refill in that cycle. Needs an active
            cycle; can't be combined with `opening_funds`.

    AdjustmentMode:
      type: string
      enum: [temporary, future, both]
      description: "temporary: this cycle only (TF). future: from the next refill (RA). both: RA, and TF by the same amount."

    BucketAdjustment:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/AdjustmentMode"
        target_funds:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The new TF, 0 or more. Only and always with `temporary`.
        refill_amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The new RA, 0 or more. Only and always with `future` and `both`.

    BucketTransfer:
      type: object
      additionalProperties: false
      required: [to_bucket_id, mode, amount]
      properties:
        to_bucket_id:
          $ref: "#/components/schemas/BucketId"
        mode:
          $ref: "#/components/schemas/AdjustmentMode"
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What to move, above 0.

    RefillAmounts:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [bucket_id, refill_amount]
            properties:
              bucket_id:
                $ref: "#/components/schemas/BucketId"
              refill_amount:
                $ref: "#/components/schemas/Amount"
        this_cycle:
          type: boolean
          default: false
          description: Also move TF in the active cycle by each refilled bucket's change in RA (BUA).

    BucketUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/BucketName"
        source_account_id:
          $ref: "#/components/schemas/AccountId"
        refill_amount:
          $ref: "#/components/schemas/Amount"
        cap_mode:
          $ref: "#/components/schemas/CapMode"
        cap_multiplier:
          $ref: "#/components/schemas/CapMultiplier"
        cap_amount:
          $ref: "#/components/schemas/Amount"
        keep_funds:
          type: boolean
        negative_tf:
          $ref: "#/components/schemas/NegativeTf"
        refill_mode:
          $ref: "#/components/schemas/RefillMode"
        overflow_destination:
          $ref: "#/components/schemas/OverflowDestination"
        priority:
          type: boolean
        importance:
          type: integer
          minimum: 1
          maximum: 10

    TransactionId:
      type: string
      description: 16-digit transaction ID. The first 8 digits are the UTC date of the transaction time.
      pattern: "^[0-9]{16}$"
      example: "2026102512345678"

    TransactionType:
      type: string
      enum: [OPB, BLA, INC, EXP, TRF, INP, OPF, REF, BUA, BAT, OVF]
      description: See spec §5.4. Only INC, EXP and TRF can be created with `POST /transactions`.

    CorrectionType:
      type: string
      enum: [none, adjustment, reversal]

    TransactionBankLine:
      type: object
      additionalProperties: false
      required: [account_id, amount]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountId"
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Signed, in the account's currency.

    TransactionBalance:
      type: object
      additionalProperties: false
      required: [account_id, balance]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountId"
        balance:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Signed, in the account's currency.

    TransactionBucketLine:
      type: object
      additionalProperties: false
      required: [bucket_id, cycle_id, amount]
      properties:
        bucket_id:
          $ref: "#/components/schemas/BucketId"
        cycle_id:
          $ref: "#/components/schemas/CycleId"
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Signed, in the bucket's currency.

    Transaction:
      type: object
      additionalProperties: false
      required: [id, type, at, counterparty, description, tags, triggers_refill, created_at, created_by, corrected, reversed, replaces, replaced_by, schedule_id, bank_lines, bucket_lines, before_reversal, balances_after]
      properties:
        id:
          $ref: "#/components/schemas/TransactionId"
        type:
          $ref: "#/components/schemas/TransactionType"
        at:
          type: string
          format: date-time
          description: When the transaction happened.
        counterparty:
          type: string
          description: The effective counterparty, from the newest correction.
        description:
          type: string
          description: The effective description, from the newest correction, or "". It may have several lines.
        tags:
          type: array
          description: The effective tags, from the newest correction.
          items:
            type: string
        triggers_refill:
          type: boolean
          description: An income that triggers the refill of its account's *on income* buckets, from the newest correction.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          nullable: true
          description: The user who entered it (6-digit user ID), or null for the system.
        corrected:
          type: boolean
          description: The transaction has adjustments.
        reversed:
          type: boolean
          description: The transaction has been reversed. Its effective lines are then empty.
        replaces:
          type: string
          nullable: true
          description: The transaction this one replaced when it was moved to another account.
        replaced_by:
          type: string
          nullable: true
          description: The transaction that replaced this one when it was moved to another account.
        schedule_id:
          type: string
          nullable: true
          description: The schedule that recorded it, or null (also once that schedule is deleted).
        bank_lines:
          type: array
          description: Effective amounts per account, the original plus its corrections. Lines that sum to 0 are left out.
          items:
            $ref: "#/components/schemas/TransactionBankLine"
        bucket_lines:
          type: array
          description: Effective amounts per bucket, the original plus its corrections. Lines that sum to 0 are left out.
          items:
            $ref: "#/components/schemas/TransactionBucketLine"
        before_reversal:
          description: |
            Set on a reversed transaction: its effective lines just before the
            reversal, so what it amounted to can still be shown. Null otherwise.
          type: object
          allOf:
            - $ref: "#/components/schemas/TransactionLines"
          nullable: true
        balances_after:
          type: array
          description: |
            Each account's balance just after this transaction, counting
            effective amounts, with corrections at the original's time (the
            balance as it is now understood). `GET /transactions/{id}` fills it
            for every account line; listing only with `account_id`, for that
            account; other responses leave it empty. Left out for an account
            the transaction comes to 0 in (reversed, or moved away).
          items:
            $ref: "#/components/schemas/TransactionBalance"
        history:
          type: array
          description: Only from `GET /transactions/{id}`. The original and its corrections, oldest first.
          items:
            $ref: "#/components/schemas/TransactionVersion"

    TransactionVersion:
      type: object
      additionalProperties: false
      required: [id, correction_type, created_at, created_by, bank_lines, bucket_lines]
      properties:
        id:
          $ref: "#/components/schemas/TransactionId"
        correction_type:
          $ref: "#/components/schemas/CorrectionType"
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          nullable: true
        bank_lines:
          type: array
          items:
            $ref: "#/components/schemas/TransactionBankLine"
        bucket_lines:
          type: array
          items:
            $ref: "#/components/schemas/TransactionBucketLine"

    TransactionLines:
      type: object
      additionalProperties: false
      required: [bank_lines, bucket_lines]
      properties:
        bank_lines:
          type: array
          items:
            $ref: "#/components/schemas/TransactionBankLine"
        bucket_lines:
          type: array
          items:
            $ref: "#/components/schemas/TransactionBucketLine"

    TransactionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page. Null on the last page.

    TransactionSummary:
      type: object
      additionalProperties: false
      required: [count, totals]
      description: What `GET /api/v1/transactions/summary` counts (#203).
      properties:
        count:
          type: integer
          minimum: 0
          description: The matching transactions, without reversed or moved ones.
        totals:
          type: array
          description: In, out (as a positive amount) and net per currency, in the order the currencies first come, newest first.
          items:
            $ref: "#/components/schemas/TransactionTotals"

    TransactionTotals:
      type: object
      additionalProperties: false
      required: [currency, in, out, net]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        in:
          $ref: "#/components/schemas/Amount"
        out:
          $ref: "#/components/schemas/Amount"
        net:
          $ref: "#/components/schemas/Amount"

    TransactionCreate:
      type: object
      additionalProperties: false
      required: [type, account_id, amount]
      properties:
        type:
          type: string
          enum: [INC, EXP, TRF]
        at:
          type: string
          format: date-time
          description: When it happened. Defaults to now; can't be in the future.
        counterparty:
          type: string
          maxLength: 200
          description: The company or person on the other side.
        description:
          type: string
          maxLength: 500
          description: An optional note of what it was. It may have several lines; it is trimmed, and Windows line breaks become plain ones.
        tags:
          type: array
          maxItems: 20
          description: Tag names. Existing tags are reused, ignoring case.
          items:
            type: string
            maxLength: 50
        triggers_refill:
          type: boolean
          description: |
            Only for an income: refill the *on income* buckets funded from
            the account that haven't been refilled in this cycle (spec §6).
            Omitted, the user's `income_refill_rules` decide; an explicit
            value overrides them. `true` needs the income to be in the active
            cycle (409 `refill_unavailable`).
        account_id:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: The account of an income or expense, or the sending account of a transfer.
        to_account_id:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: The receiving account of a transfer.
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Positive.
        bucket_lines:
          type: array
          description: For an income or expense, the parts that go to or come from buckets.
          items:
            type: object
            additionalProperties: false
            required: [bucket_id, amount]
            properties:
              bucket_id:
                $ref: "#/components/schemas/BucketId"
              amount:
                allOf:
                  - $ref: "#/components/schemas/Amount"
                description: Positive.

    Tag:
      type: object
      additionalProperties: false
      required: [name, last_used_at]
      properties:
        name:
          type: string
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: The time of the newest transaction with the tag; null if none has it.

    CounterpartySuggestion:
      type: object
      additionalProperties: false
      required: [counterparty, type, at, account_id, tags, bucket_ids]
      properties:
        counterparty:
          type: string
        type:
          type: string
          enum: [INC, EXP]
        at:
          type: string
          format: date-time
          description: The time of the newest transaction with it.
        account_id:
          $ref: "#/components/schemas/AccountId"
        tags:
          type: array
          items:
            type: string
        bucket_ids:
          type: array
          description: The buckets it had lines on, in order. They may since have been deleted.
          items:
            $ref: "#/components/schemas/BucketId"

    TransactionCorrection:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The desired values. Omitted fields keep their current values.
      properties:
        account_id:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: Moves the transaction to this account (reverse and re-create).
        to_account_id:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: Moves a transfer to this receiving account (reverse and re-create).
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Positive, except for OPB and BLA (signed).
        bucket_lines:
          type: array
          description: Replaces all bucket lines; an empty list removes them.
          items:
            type: object
            additionalProperties: false
            required: [bucket_id, amount]
            properties:
              bucket_id:
                $ref: "#/components/schemas/BucketId"
              amount:
                allOf:
                  - $ref: "#/components/schemas/Amount"
                description: Positive.
        counterparty:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 500
          description: The new description; "" removes it.
        tags:
          type: array
          maxItems: 20
          description: Replaces all tags; an empty list removes them.
          items:
            type: string
            maxLength: 50
        triggers_refill:
          type: boolean
          description: |
            Only for an income. `true` refills its account's *on income*
            buckets now, if the income is in the active cycle (409
            `refill_unavailable` otherwise). `false` undoes the refills it
            triggered in the active cycle.

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI identifying the problem type. `about:blank` means the HTTP status says it all.
          example: about:blank
        title:
          type: string
          description: Short summary of the problem type. For `about:blank` this is the HTTP status text.
          example: Not Found
        status:
          type: integer
          description: HTTP status code.
          example: 404
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          description: Request path the problem occurred on.
          example: /api/v1/accounts/1234
        code:
          type: string
          description: Stable, machine-readable error code, such as `not_found` or `invalid_request`.
          example: not_found
        request_id:
          type: string
          description: Same as the `X-Request-ID` response header. Quote it when reporting a bug.

    ScheduleId:
      type: string
      description: 10-digit schedule ID (the owner's user ID, then 4 digits).
      pattern: "^[1-9][0-9]{9}$"
      example: "4829135521"

    ScheduledTransactionId:
      type: string
      description: 18-digit ID of a schedule's occurrence (the schedule's ID, then 8 digits).
      pattern: "^[1-9][0-9]{17}$"
      example: "482913552100417731"

    ScheduleMode:
      type: string
      enum: [auto, approve]
      description: "`auto` records each occurrence when it comes due; `approve` queues it for approval."

    ScheduleFrequency:
      type: string
      enum: [once, day, week, month, year]

    ScheduleTransaction:
      type: object
      additionalProperties: false
      required: [type, account_id, amount]
      description: What a schedule records, as in `POST /transactions` without `at`.
      properties:
        type:
          type: string
          enum: [INC, EXP, TRF]
        counterparty:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 500
          description: An optional note, given to each transaction the schedule records.
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        triggers_refill:
          type: boolean
          description: As in `POST /transactions`. Omitted, the user's `income_refill_rules` decide when it's recorded.
        account_id:
          $ref: "#/components/schemas/AccountId"
        to_account_id:
          $ref: "#/components/schemas/AccountId"
        amount:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Positive.
        bucket_lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bucket_id, amount]
            properties:
              bucket_id:
                $ref: "#/components/schemas/BucketId"
              amount:
                allOf:
                  - $ref: "#/components/schemas/Amount"
                description: Positive.

    ScheduleInput:
      type: object
      additionalProperties: false
      required: [transaction, mode, start_date, time, frequency]
      properties:
        name:
          type: string
          maxLength: 60
          description: Optional, trimmed.
        transaction:
          $ref: "#/components/schemas/ScheduleTransaction"
        mode:
          $ref: "#/components/schemas/ScheduleMode"
        due_days:
          type: integer
          minimum: 0
          maximum: 60
          default: 3
          description: For `approve`, how many days before its time an occurrence is queued for approval.
        start_date:
          type: string
          format: date
          description: The date of the first occurrence, in `time_zone`.
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: The time of day of each occurrence (HH:MM), in `time_zone`.
          example: "08:00"
        time_zone:
          type: string
          maxLength: 64
          description: An IANA time zone. Omitted, the user's `time_zone` preference, else UTC.
          example: Europe/Oslo
        frequency:
          $ref: "#/components/schemas/ScheduleFrequency"
        every:
          type: integer
          minimum: 1
          maximum: 366
          default: 1
          description: Every how many days, weeks, months or years. Ignored for `once`.
        end_count:
          type: integer
          minimum: 1
          description: Ends after this many occurrences, counted from `start_date`. Not with `end_date`.
        end_date:
          type: string
          format: date
          description: Ends after the occurrence on this date. Not with `end_count`.
        paused:
          type: boolean
          default: false
          description: A paused schedule's occurrences aren't recorded or queued.

    SchedulePreview:
      type: object
      additionalProperties: false
      required: [start_date, time, frequency]
      description: The repeat of a ScheduleInput, and how many times to list.
      properties:
        start_date:
          type: string
          format: date
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "08:00"
        time_zone:
          type: string
          maxLength: 64
        frequency:
          $ref: "#/components/schemas/ScheduleFrequency"
        every:
          type: integer
          minimum: 1
          maximum: 366
          default: 1
        end_count:
          type: integer
          minimum: 1
        end_date:
          type: string
          format: date
        count:
          type: integer
          minimum: 1
          maximum: 50
          default: 5

    Schedule:
      type: object
      additionalProperties: false
      required: [id, name, transaction, mode, due_days, start_date, time, time_zone, frequency, every,
        end_count, end_date, paused, next_index, next_at, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ScheduleId"
        name:
          type: string
        transaction:
          $ref: "#/components/schemas/ScheduleTransaction"
        mode:
          $ref: "#/components/schemas/ScheduleMode"
        due_days:
          type: integer
        start_date:
          type: string
          format: date
        time:
          type: string
          example: "08:00"
        time_zone:
          type: string
        frequency:
          $ref: "#/components/schemas/ScheduleFrequency"
        every:
          type: integer
        end_count:
          type: integer
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        paused:
          type: boolean
        next_index:
          type: integer
          description: The number of the next occurrence, from 0 (counted from `start_date`).
        next_at:
          type: string
          format: date-time
          nullable: true
          description: When the next occurrence is due. Null when the schedule has ended.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScheduledTransactionState:
      type: string
      enum: [applied, queued, skipped]

    ScheduledTransactionReason:
      type: string
      enum: [approval, no_active_cycle, outside_cycle, invalid]
      description: |
        Why it's queued: the schedule asks for approval, there was no active
        cycle, its time was outside the active cycle, or the transaction
        broke a rule (see `detail`), for example a deleted account or bucket.

    ScheduledTransaction:
      type: object
      additionalProperties: false
      required: [id, schedule_id, scheduled_at, state, reason, detail, queued_at, due_at, overdue, transaction_id, resolved_at]
      properties:
        id:
          $ref: "#/components/schemas/ScheduledTransactionId"
        schedule_id:
          $ref: "#/components/schemas/ScheduleId"
        scheduled_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/ScheduledTransactionState"
        reason:
          type: string
          allOf:
            - $ref: "#/components/schemas/ScheduledTransactionReason"
          nullable: true
          description: Set when it was queued.
        detail:
          type: string
          description: For `invalid`, the rule it broke.
        queued_at:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
          description: When a queued one is due for approval, its scheduled time.
        overdue:
          type: boolean
          description: A queued one past its due time.
        transaction_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/TransactionId"
          nullable: true
          description: The transaction it recorded.
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: When it was applied or skipped.

    ApprovedScheduledTransaction:
      type: object
      additionalProperties: false
      required: [scheduled_transaction, transaction]
      properties:
        scheduled_transaction:
          $ref: "#/components/schemas/ScheduledTransaction"
        transaction:
          $ref: "#/components/schemas/Transaction"

    UpcomingTransaction:
      type: object
      additionalProperties: false
      required: [schedule_id, at]
      properties:
        schedule_id:
          $ref: "#/components/schemas/ScheduleId"
        at:
          type: string
          format: date-time

    ScheduledTransactionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledTransaction"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page. Null on the last page.

    NotificationKind:
      type: string
      enum: [approval_queue, upcoming_bill, investment_balance, bucket_uncovered]

    Notification:
      type: object
      additionalProperties: false
      required: [key, kind, severity, at, count, overdue, schedule_id, account_id, bucket_id, cycle_id, amount, currency]
      description: |
        A reminder or to-do. The client words it from `kind` and the fields
        that kind uses (see `listNotifications`); the others are null.
      properties:
        key:
          type: string
          maxLength: 200
          description: What it's about. Pass it to `dismissNotification`.
          example: "bill:4829135521:1794729600"
        kind:
          $ref: "#/components/schemas/NotificationKind"
        severity:
          type: string
          enum: [info, warning, alert]
          description: |
            `alert` for an overdue approval or an uncovered bucket,
            `warning` for an approval that isn't overdue, else `info`.
        at:
          type: string
          format: date-time
          nullable: true
          description: |
            When it applies: the newest queued transaction's queue time, the
            bill's time, or the cycle's start. Null for an uncovered bucket.
        count:
          type: integer
          nullable: true
          description: How many wait for approval.
        overdue:
          type: integer
          nullable: true
          description: How many of them are overdue.
        schedule_id:
          type: string
          nullable: true
        account_id:
          type: string
          nullable: true
        bucket_id:
          type: string
          nullable: true
        cycle_id:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
          description: The bill's amount, or what the bucket is missing (TF − CAF).
        currency:
          type: string
          nullable: true

    NotificationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"

    NotificationDismiss:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200

    NotificationSettings:
      type: object
      additionalProperties: false
      description: Missing or null fields use the default.
      properties:
        approval_queue:
          type: boolean
          nullable: true
          description: Scheduled transactions waiting for approval. Null means true.
        upcoming_bills:
          type: boolean
          nullable: true
          description: Expenses and transfers coming up. Null means true.
        upcoming_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 14
          description: How many days ahead a bill shows. Null means 3.
        investment_balance:
          type: boolean
          nullable: true
          description: Investment and fund balances to update when a cycle starts. Null means true.
        bucket_uncovered:
          type: boolean
          nullable: true
          description: Priority buckets that aren't covered. Null means true.
