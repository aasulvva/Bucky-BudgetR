# Dev services. The backend and frontend run natively (see docs/DEVELOPMENT.md).
# Values come from .env; the defaults match .env.example.
name: bucky-budgetr

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bucky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bucky}
      POSTGRES_DB: ${POSTGRES_DB:-bucky}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep the data in a versioned subdirectory of this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Report PDFs (#127), only with --profile pdf. It loads the print page from
  # Vite on the host (VITE_HOST, see docs/DEVELOPMENT.md).
  chrome:
    image: chromedp/headless-shell:156.0.8078.48
    profiles: [pdf]
    restart: unless-stopped
    user: "65534:65534"
    environment:
      HOME: /tmp
    command: ["--user-data-dir=/tmp/profile", "--disable-extensions", "--no-first-run"]
    ports:
      - "127.0.0.1:${CHROME_PORT:-9222}:9222"
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  db-data:
