# The production stack: the app, PostgreSQL, Caddy (HTTPS on the LAN),
# daily backups and a headless Chrome for report PDFs. compose.tailnet.yaml adds the tailnet address; .env picks
# the files with COMPOSE_FILE. Settings come from deploy/.env; see
# .env.example and docs/DEPLOYMENT.md. Run Compose from this folder.
name: bucky-budgetr-prod

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bucky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-bucky}
    volumes:
      # PostgreSQL 18+ images keep the data in a versioned subdirectory of this path.
      - db-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: ..
      args:
        GIT_COMMIT: ${BUCKY_COMMIT:-unknown}
    image: bucky-budgetr:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bucky}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bucky}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Caddy, the only way in; its X-Forwarded-For gives the client's address.
      TRUSTED_PROXIES: 172.30.86.10
      BUCKY_INITIAL_ADMIN_PASSWORD: ${BUCKY_INITIAL_ADMIN_PASSWORD:-}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-}
      SCHEDULE_INTERVAL: ${SCHEDULE_INTERVAL:-}
      # Report PDFs (#127): the Chrome below, and the app as it reaches it.
      PDF_CHROME_URL: http://chrome:9222
      PDF_APP_URL: http://app:8080
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    healthcheck:
      test: ["CMD", "bucky-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # Only on the LAN address (and the tailnet's, compose.tailnet.yaml), not
    # on every interface.
    ports:
      - ${LAN_ADDR:?set LAN_ADDR in deploy/.env}:443:443
      - ${LAN_ADDR}:80:80
    environment:
      BUCKY_HOSTNAMES: ${BUCKY_HOSTNAMES:?set BUCKY_HOSTNAMES in deploy/.env}
      DEFAULT_SNI: ${LAN_ADDR}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-cert.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-key.pem}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR in deploy/.env}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks:
      edge: {}
      internal:
        ipv4_address: 172.30.86.10
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Renders report PDFs (#127): the app drives it over DevTools, and it loads
  # the app's print page with a short-lived, read-only token. On the
  # internal network only, so it reaches nothing outside the stack.
  chrome:
    image: chromedp/headless-shell:156.0.8078.48
    restart: unless-stopped
    user: "65534:65534"
    environment:
      HOME: /tmp
    command: ["--user-data-dir=/tmp/profile", "--disable-extensions", "--no-first-run"]
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    healthcheck:
      # HTTP/1.1: Chrome's DevTools server refuses HTTP/1.0.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9223 && printf 'GET /json/version HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q Browser <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    # After the app, so the first dump has the migrated schema.
    depends_on:
      app:
        condition: service_healthy
    # Owns the dumps on the host.
    user: ${BACKUP_UID:-1000}:${BACKUP_GID:-1000}
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    command: ["daemon"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-bucky}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bucky}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TZ: ${TZ:-UTC}
      KEEP_DAILY: ${KEEP_DAILY:-14}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-8}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-12}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:?set BACKUP_DIR in deploy/.env}:/backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/backup.sh", "health"]
      interval: 5m
      timeout: 10s
      start_period: 1m

networks:
  # Published ports; only Caddy is on it.
  edge: {}
  # Everything else: no way in or out except through Caddy. If the subnet
  # clashes with your network, change it and the two addresses above.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.86.0/24

volumes:
  db-data:
  caddy-data:
  caddy-config:
