# sqlc generates type-safe Go from the SQL in internal/db/queries, checked
# against the schema built from the goose migrations. Run with `make generate`.
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          # Timestamps are stored as UTC timestamptz; use plain time.Time in Go.
          - db_type: timestamptz
            go_type: time.Time
          # Calendar dates (transaction and cycle dates): time.Time at UTC midnight.
          - db_type: date
            go_type: time.Time
          # Money: exact decimals, never float64 (see internal/money).
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type: github.com/shopspring/decimal.NullDecimal
