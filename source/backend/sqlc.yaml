# sqlc generates type-safe Go from the SQL in internal/db/queries, checked
# against the schema built from the goose migrations. Run with `make generate`.
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
