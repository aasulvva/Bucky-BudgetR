# Live reload for `make dev-backend` (go tool air). Rebuilds on Go and SQL changes.
root = "."
tmp_dir = "tmp"

[build]
  # The debug tag adds the debug settings (internal/debug, #100).
  cmd = "go build -tags debug -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
