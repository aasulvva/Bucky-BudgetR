# golangci-lint v2 (go tool golangci-lint). Run with `make lint`.
version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - sloglint
    - unconvert
    - usestdlibvars
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: false
      kv-only: false
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Tests may build SQL from trusted identifiers and ignore some errors.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aasulvva/Bucky-BudgetR
