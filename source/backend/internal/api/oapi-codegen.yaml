# Generates api.gen.go from the contract in api/openapi.yaml. Run `make generate`.
package: api
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  # Nullable fields become nullable.Nullable[T], which tells an explicit null
  # (e.g. "reset this preference") apart from a missing field.
  nullable-type: true
