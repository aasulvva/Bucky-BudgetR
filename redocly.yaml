# Redocly CLI config for linting api/openapi.yaml (`make lint`).
extends:
  - recommended

rules:
  # The probes and (for now) the whole API rely on network-level access
  # control (LAN/Tailscale); auth arrives with #9.
  security-defined: off
  # Every operation has `default: Error` (a Problem), which covers 4xx too.
  operation-4xx-response: off
  # Private, unlicensed project.
  info-license: off
